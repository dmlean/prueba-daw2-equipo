
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trama - Espacio de trabajo</title>
    <link rel="stylesheet" href="estilos.css">

    <style>
        .clases {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .tarjeta {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            width: 260px;
        }

        .abrir {
            cursor: pointer;
            color: #555;
            text-decoration: underline;
        }

        .eliminar {
            cursor: pointer;
            color: #b33;
            border: none;
            background: none;
        }

        .vista-proyecto {
            padding: 20px;
        }

        .oculto {
            display: none;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <img src="../../../../../output/prototip/trama/recursos/logo-principal.svg"
             alt="Trama" width="164" height="47">
    </div>

    <div class="inic">Iniciar Sesión</div>
</header>

<hr>

<main>

    <!-- PANTALLA PRINCIPAL -->

    <section id="pantallaInicio">

        <p class="titulo">ESPACIO DE TRABAJO</p>

        <p class="proyectos">Tus Proyectos</p>

        <p>Elige un proyecto y sigue con tu trabajo.</p>

        <button onclick="crearProyecto()">
            + Crear un Proyecto
        </button>

        <div class="clases" id="listaProyectos"></div>

    </section>


    <!-- PANTALLA DE CADA PROYECTO -->

    <section id="pantallaProyecto" class="oculto">

        <button onclick="volverInicio()">
            ← Volver a proyectos
        </button>

        <div class="vista-proyecto">

            <h1 id="nombreProyecto"></h1>

            <p id="descripcionProyecto">
                Bienvenido a tu espacio de trabajo.
            </p>

            <hr>

            <h3>Contenido del proyecto</h3>

            <p>
                Aquí podrás desarrollar y organizar el trabajo
                de este proyecto.
            </p>

        </div>

    </section>

</main>


<script>

    // Recuperar proyectos guardados

    let proyectos = JSON.parse(
        localStorage.getItem("proyectosTrama")
    );

    // Crear proyectos iniciales si es la primera visita

    if (proyectos === null) {

        proyectos = [
            {
                id: 1,
                nombre: "Portal del Taller"
            },
            {
                id: 2,
                nombre: "Guía del Barrio"
            }
        ];

        guardarProyectos();
    }


    // Guardar proyectos en el navegador

    function guardarProyectos() {

        localStorage.setItem(
            "proyectosTrama",
            JSON.stringify(proyectos)
        );

    }


    // Mostrar todos los proyectos

    function mostrarProyectos() {

        const lista = document.getElementById("listaProyectos");

        lista.innerHTML = "";

        proyectos.forEach(function(proyecto) {

            const tarjeta = document.createElement("div");
            tarjeta.className = "tarjeta";

            const titulo = document.createElement("h3");
            titulo.textContent = proyecto.nombre;

            const descripcion = document.createElement("p");
            descripcion.textContent =
                "Espacio de trabajo de " + proyecto.nombre;

            const abrir = document.createElement("p");
            abrir.className = "abrir";
            abrir.textContent = "Abrir proyecto";

            abrir.onclick = function() {
                abrirProyecto(proyecto.id);
            };

            const eliminar = document.createElement("button");
            eliminar.className = "eliminar";
            eliminar.textContent = "Eliminar proyecto";

            eliminar.onclick = function() {
                eliminarProyecto(proyecto.id);
            };

            tarjeta.appendChild(titulo);
            tarjeta.appendChild(descripcion);
            tarjeta.appendChild(document.createElement("hr"));
            tarjeta.appendChild(abrir);
            tarjeta.appendChild(eliminar);

            lista.appendChild(tarjeta);

        });

    }


    // Crear un proyecto nuevo

    function crearProyecto() {

        let nombre = prompt("Escribe el nombre del nuevo proyecto:");

        if (nombre && nombre.trim() !== "") {

            const nuevoProyecto = {
                id: Date.now(),
                nombre: nombre.trim()
            };

            proyectos.push(nuevoProyecto);

            guardarProyectos();

            mostrarProyectos();

        }

    }


    // Abrir un proyecto

    function abrirProyecto(id) {

        const proyecto = proyectos.find(function(p) {
            return p.id === id;
        });

        if (!proyecto) return;

        document.getElementById("pantallaInicio")
            .classList.add("oculto");

        document.getElementById("pantallaProyecto")
            .classList.remove("oculto");

        document.getElementById("nombreProyecto")
            .textContent = proyecto.nombre;

        document.getElementById("descripcionProyecto")
            .textContent = "Bienvenido al proyecto " + proyecto.nombre;

    }


    // Volver a la pantalla inicial

    function volverInicio() {

        document.getElementById("pantallaProyecto")
            .classList.add("oculto");

        document.getElementById("pantallaInicio")
            .classList.remove("oculto");

    }


    // Eliminar un proyecto

    function eliminarProyecto(id) {

        const confirmar = confirm(
            "¿Seguro que quieres eliminar este proyecto?"
        );

        if (confirmar) {

            proyectos = proyectos.filter(function(p) {
                return p.id !== id;
            });

            guardarProyectos();

            mostrarProyectos();

        }

    }


    // Cargar los proyectos al iniciar la página

    mostrarProyectos();

</script>

</body>
</html>
