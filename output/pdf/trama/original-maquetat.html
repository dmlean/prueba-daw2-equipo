<!doctype html><html lang="ca"><meta charset="utf-8"><title>Trama · Versió editorial tancada</title><style>@font-face{font-family:'DM Sans';src:url('recursos/DM-Sans-Regular.ttf');font-weight:400}@font-face{font-family:'DM Sans';src:url('recursos/DM-Sans-Medium.ttf');font-weight:500}@font-face{font-family:'DM Sans';src:url('recursos/DM-Sans-Bold.ttf');font-weight:700}body{margin:0;background:#e8e9e3;font-family:'DM Sans',sans-serif}.pagina{width:210mm;height:297mm;margin:12mm auto;background:white;box-shadow:0 2px 14px #17343b22}.pagina svg{width:100%;height:100%;font-family:'DM Sans'}@page{size:A4;margin:0}@media print{body{background:white}.pagina{margin:0;box-shadow:none;break-after:page}}</style><body><section class="pagina" aria-label="Pàgina 1: Manual d’identitat corporativa visual"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Manual d’identitat corporativa visual</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="68.928" font-size="9" font-weight="500" fill="#176B5B">IDENTITAT VISUAL · 01</text><g transform="translate(51.0236,134) scale(2.0,2.0)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><text x="139.0236" y="199.488" font-size="64" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="321.728" font-size="34" font-weight="700" fill="#17343B">Manual d’identitat</text><text x="51.0236" y="360.728" font-size="34" font-weight="700" fill="#17343B">corporativa visual</text><text x="51.0236" y="403.872" font-size="16" font-weight="400" fill="#17343B">Base visual per a una aplicació web de gestió de</text><text x="51.0236" y="426.872" font-size="16" font-weight="400" fill="#17343B">projectes</text><rect x="51.0236" y="470" width="270" height="34" rx="5" fill="#176B5B" stroke="none" stroke-width="0.6"/><text x="63.0236" y="490.904" font-size="12" font-weight="500" fill="#FFFFFF">Versió editorial tancada</text><text x="51.0236" y="536.416" font-size="10.5" font-weight="400" fill="#17343B">Sistema visual, criteris d’ús i exemples d’aplicació per compartir una mateixa</text><text x="51.0236" y="551.416" font-size="10.5" font-weight="400" fill="#17343B">base de disseny.</text><text x="51.0236" y="702.928" font-size="9" font-weight="400" fill="#17343B">Les decisions d’identitat s’adopten per a aquesta versió editorial. El tancament del document no acredita un acord</text><text x="51.0236" y="715.428" font-size="9" font-weight="400" fill="#17343B">col·lectiu ni una entrega acadèmica.</text><text x="51.0236" y="760.92" font-size="10" font-weight="500" fill="#17343B">04 d’octubre de 2026</text></svg></section><section class="pagina" aria-label="Pàgina 2: Índex i objecte del manual"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Índex i objecte del manual</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Una base compartida</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Índex i objecte del manual</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">Aquest manual ordena la identitat visual de Trama perquè la interfície, els prototips i la</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">documentació parlin el mateix llenguatge. Defineix criteris de color, tipografia, logo, recursos i</text><text x="51.0236" y="176.416" font-size="10.5" font-weight="400" fill="#17343B">components, i mostra com aplicar-los a situacions de gestió de projectes.</text><text x="51.0236" y="207.912" font-size="11" font-weight="700" fill="#176B5B">01</text><text x="99.0236" y="206.92" font-size="10" font-weight="500" fill="#17343B">Portada</text><line x1="51.0236" y1="226" x2="288.6377952755906" y2="226" stroke="#17343B" stroke-width="0.3"/><text x="51.0236" y="242.912" font-size="11" font-weight="700" fill="#176B5B">02</text><text x="99.0236" y="241.92" font-size="10" font-weight="500" fill="#17343B">Índex i objecte del manual</text><line x1="51.0236" y1="261" x2="288.6377952755906" y2="261" stroke="#17343B" stroke-width="0.3"/><text x="51.0236" y="277.912" font-size="11" font-weight="700" fill="#176B5B">03</text><text x="99.0236" y="276.92" font-size="10" font-weight="500" fill="#17343B">Públic i empatia</text><line x1="51.0236" y1="296" x2="288.6377952755906" y2="296" stroke="#17343B" stroke-width="0.3"/><text x="51.0236" y="312.912" font-size="11" font-weight="700" fill="#176B5B">04</text><text x="99.0236" y="311.92" font-size="10" font-weight="500" fill="#17343B">Moodboard i direcció visual</text><line x1="51.0236" y1="331" x2="288.6377952755906" y2="331" stroke="#17343B" stroke-width="0.3"/><text x="51.0236" y="347.912" font-size="11" font-weight="700" fill="#176B5B">05</text><text x="99.0236" y="346.92" font-size="10" font-weight="500" fill="#17343B">Missió, visió, valors i to</text><line x1="51.0236" y1="366" x2="288.6377952755906" y2="366" stroke="#17343B" stroke-width="0.3"/><text x="51.0236" y="382.912" font-size="11" font-weight="700" fill="#176B5B">06–07</text><text x="99.0236" y="381.92" font-size="10" font-weight="500" fill="#17343B">Paleta, funcions i contrast</text><line x1="51.0236" y1="401" x2="288.6377952755906" y2="401" stroke="#17343B" stroke-width="0.3"/><text x="51.0236" y="417.912" font-size="11" font-weight="700" fill="#176B5B">08–09</text><text x="99.0236" y="416.92" font-size="10" font-weight="500" fill="#17343B">Tipografia i escala</text><line x1="51.0236" y1="436" x2="288.6377952755906" y2="436" stroke="#17343B" stroke-width="0.3"/><text x="306.6377952755906" y="207.912" font-size="11" font-weight="700" fill="#176B5B">10–11</text><text x="354.6377952755906" y="206.92" font-size="10" font-weight="500" fill="#17343B">Logo i versions</text><line x1="306.6377952755906" y1="226" x2="544.2519905511812" y2="226" stroke="#17343B" stroke-width="0.3"/><text x="306.6377952755906" y="242.912" font-size="11" font-weight="700" fill="#176B5B">12</text><text x="354.6377952755906" y="241.92" font-size="10" font-weight="500" fill="#17343B">Imatges i recursos visuals</text><line x1="306.6377952755906" y1="261" x2="544.2519905511812" y2="261" stroke="#17343B" stroke-width="0.3"/><text x="306.6377952755906" y="277.912" font-size="11" font-weight="700" fill="#176B5B">13–14</text><text x="354.6377952755906" y="276.92" font-size="10" font-weight="500" fill="#17343B">Usos incorrectes i correctes</text><line x1="306.6377952755906" y1="296" x2="544.2519905511812" y2="296" stroke="#17343B" stroke-width="0.3"/><text x="306.6377952755906" y="312.912" font-size="11" font-weight="700" fill="#176B5B">15–16</text><text x="354.6377952755906" y="311.92" font-size="10" font-weight="500" fill="#17343B">Aplicació al producte</text><line x1="306.6377952755906" y1="331" x2="544.2519905511812" y2="331" stroke="#17343B" stroke-width="0.3"/><text x="306.6377952755906" y="347.912" font-size="11" font-weight="700" fill="#176B5B">17</text><text x="354.6377952755906" y="346.92" font-size="10" font-weight="500" fill="#17343B">Justificació i ODS</text><line x1="306.6377952755906" y1="366" x2="544.2519905511812" y2="366" stroke="#17343B" stroke-width="0.3"/><text x="306.6377952755906" y="382.912" font-size="11" font-weight="700" fill="#176B5B">18</text><text x="354.6377952755906" y="381.92" font-size="10" font-weight="500" fill="#17343B">Resum de normes i comprovacions</text><text x="354.6377952755906" y="395.92" font-size="10" font-weight="500" fill="#17343B">pendents</text><line x1="306.6377952755906" y1="403" x2="544.2519905511812" y2="403" stroke="#17343B" stroke-width="0.3"/><text x="51.0236" y="477.888" font-size="14" font-weight="500" fill="#17343B">Com s’ha d’utilitzar</text><text x="51.0236" y="498.416" font-size="10.5" font-weight="400" fill="#17343B">Consulteu les normes abans de crear una pantalla o una peça nova. Reutilitzeu els mateixos estils i</text><text x="51.0236" y="513.416" font-size="10.5" font-weight="400" fill="#17343B">components; adapteu la composició a l’espai disponible sense canviar la jerarquia ni el significat dels</text><text x="51.0236" y="528.416" font-size="10.5" font-weight="400" fill="#17343B">estats. Els exemples concreten el sistema, però no substitueixen l’anàlisi funcional del producte.</text><text x="51.0236" y="558.888" font-size="14" font-weight="500" fill="#17343B">Abast i estat de la versió</text><text x="51.0236" y="579.416" font-size="10.5" font-weight="400" fill="#17343B">La base documental consultada és el clon local de dmlean/prueba-daw2-equipo: instruccions,</text><text x="51.0236" y="594.416" font-size="10.5" font-weight="400" fill="#17343B">síntesi, mapa d’evidències i notes de missió i tipografia. El nom Trama hi figura com a decisió</text><text x="51.0236" y="609.416" font-size="10.5" font-weight="400" fill="#17343B">registrada. Les decisions d’identitat desenvolupades aquí s’adopten per encàrrec per tancar aquesta</text><text x="51.0236" y="624.416" font-size="10.5" font-weight="400" fill="#17343B">versió editorial. No s’ha comprovat un acord col·lectiu sobre el conjunt, una revisió de l’equip ni una</text><text x="51.0236" y="639.416" font-size="10.5" font-weight="400" fill="#17343B">entrega acadèmica. Revisió local consultada: 17bf9ff, branca main, sense canvis previs. No s’ha</text><text x="51.0236" y="654.416" font-size="10.5" font-weight="400" fill="#17343B">comprovat que coincideixi amb la darrera revisió remota.</text><text x="51.0236" y="679.928" font-size="9" font-weight="400" fill="#17343B">Les composicions de producte d’aquest manual són exemples de disseny. L’existència i l’adequació del wireframe o</text><text x="51.0236" y="692.428" font-size="9" font-weight="400" fill="#17343B">prototip s’han de comprovar per separat.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">02</text></svg></section><section class="pagina" aria-label="Pàgina 3: Públic i empatia"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Públic i empatia</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Orientar abans de decorar</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Públic i empatia</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">El públic acadèmic documentat són equips d’estudiants que han de coordinar projectes, membres i</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">tasques. La identitat ha d’ajudar a trobar el projecte adequat, entendre qui té una responsabilitat i</text><text x="51.0236" y="176.416" font-size="10.5" font-weight="400" fill="#17343B">reconèixer l’acció disponible sense haver de reaprendre cada pantalla.</text><text x="51.0236" y="210.888" font-size="14" font-weight="500" fill="#17343B">Necessitats segons la situació</text><text x="51.0236" y="231.416" font-size="10.5" font-weight="400" fill="#17343B">Qui coordina necessita una visió clara del projecte i dels col·laboradors. Qui col·labora necessita llegir</text><text x="51.0236" y="246.416" font-size="10.5" font-weight="400" fill="#17343B">les tasques, localitzar-ne el responsable i distingir «Per fer», «En progrés» i «Feta». Qui gestiona una</text><text x="51.0236" y="261.416" font-size="10.5" font-weight="400" fill="#17343B">tasca necessita formularis comprensibles i retorn visible després d’una acció. Aquests contextos</text><text x="51.0236" y="276.416" font-size="10.5" font-weight="400" fill="#17343B">poden correspondre a una mateixa persona; les accions que es mostren depenen del seu rol i de les</text><text x="51.0236" y="291.416" font-size="10.5" font-weight="400" fill="#17343B">responsabilitats documentades.</text><text x="51.0236" y="321.888" font-size="14" font-weight="500" fill="#17343B">Una exploració comercial separada</text><text x="51.0236" y="342.416" font-size="10.5" font-weight="400" fill="#17343B">Decisió editorial adoptada: orientar la marca també a pimes, equips creatius, la indústria de</text><text x="51.0236" y="357.416" font-size="10.5" font-weight="400" fill="#17343B">l’entreteniment i negocis locals. Aquesta línia dona calidesa i proximitat a la comunicació, però no</text><text x="51.0236" y="372.416" font-size="10.5" font-weight="400" fill="#17343B">modifica el producte acadèmic ni prova que s’hagin investigat aquests públics.</text><text x="51.0236" y="402.888" font-size="14" font-weight="500" fill="#17343B">Mapa d’empatia · Hipòtesi de disseny</text><rect x="51.0236" y="413" width="240.6141952755906" height="93" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="63.0236" y="434.912" font-size="11" font-weight="500" fill="#176B5B">Pensa i necessita</text><text x="63.0236" y="454.424" font-size="9.5" font-weight="400" fill="#17343B">Saber què cal fer i què pot fer. Títols explícits,</text><text x="63.0236" y="467.424" font-size="9.5" font-weight="400" fill="#17343B">estats escrits i accions amb verbs.</text><rect x="303.6377952755906" y="413" width="240.6141952755906" height="93" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="315.6377952755906" y="434.912" font-size="11" font-weight="500" fill="#176B5B">Veu</text><text x="315.6377952755906" y="454.424" font-size="9.5" font-weight="400" fill="#17343B">Projectes, tasques i persones en una mateixa</text><text x="315.6377952755906" y="467.424" font-size="9.5" font-weight="400" fill="#17343B">eina. Agrupacions estables i responsables al</text><text x="315.6377952755906" y="480.424" font-size="9.5" font-weight="400" fill="#17343B">costat de les tasques.</text><rect x="51.0236" y="516" width="240.6141952755906" height="93" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="63.0236" y="537.912" font-size="11" font-weight="500" fill="#176B5B">Fa</text><text x="63.0236" y="557.424" font-size="9.5" font-weight="400" fill="#17343B">Consulta, crea, s’autoassigna o actualitza segons</text><text x="63.0236" y="570.424" font-size="9.5" font-weight="400" fill="#17343B">els permisos. Components repetibles i formularis</text><text x="63.0236" y="583.424" font-size="9.5" font-weight="400" fill="#17343B">amb etiquetes visibles.</text><rect x="303.6377952755906" y="516" width="240.6141952755906" height="93" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="315.6377952755906" y="537.912" font-size="11" font-weight="500" fill="#176B5B">Troba dificultats</text><text x="315.6377952755906" y="557.424" font-size="9.5" font-weight="400" fill="#17343B">Pot perdre temps buscant informació o</text><text x="315.6377952755906" y="570.424" font-size="9.5" font-weight="400" fill="#17343B">interpretant símbols. Contrast suficient, espai i</text><text x="315.6377952755906" y="583.424" font-size="9.5" font-weight="400" fill="#17343B">missatges concrets.</text><rect x="51.0236" y="619" width="493.2283905511812" height="61" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="63.0236" y="638.912" font-size="11" font-weight="500" fill="#176B5B">Espera obtenir</text><text x="63.0236" y="657.424" font-size="9.5" font-weight="400" fill="#17343B">Orientació ràpida i menys interrupcions. Jerarquia consistent i retorn immediat que expliqui el resultat.</text><text x="51.0236" y="707.888" font-size="14" font-weight="500" fill="#17343B">Hipòtesi de disseny</text><text x="51.0236" y="728.416" font-size="10.5" font-weight="400" fill="#17343B">Aquest mapa proposa preguntes i necessitats per orientar el disseny. No resumeix entrevistes ni</text><text x="51.0236" y="743.416" font-size="10.5" font-weight="400" fill="#17343B">atribueix frases a persones reals. Cal contrastar-lo amb l’equip i amb persones que provin el</text><text x="51.0236" y="758.416" font-size="10.5" font-weight="400" fill="#17343B">producte abans de considerar-lo recerca validada.</text><text x="51.0236" y="783.928" font-size="9" font-weight="400" fill="#17343B">Criteri de disseny: reduir la fricció visual sense ocultar dades necessàries ni suggerir permisos inexistents.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">03</text></svg></section><section class="pagina" aria-label="Pàgina 4: Moodboard i direcció visual"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Moodboard i direcció visual</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Ordre amb proximitat</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Moodboard i direcció visual</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">Decisió editorial adoptada. Aquest moodboard és una composició pròpia de mostres visuals: no</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">reprodueix identitats de tercers ni utilitza fotografies externes. Combina una estructura ordenada</text><text x="51.0236" y="176.416" font-size="10.5" font-weight="400" fill="#17343B">amb una expressió propera, adequada a una eina que s’utilitza per treballar.</text><rect x="51.0236" y="197" width="240.6141952755906" height="132" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="63.0236" y="217.92" font-size="10" font-weight="500" fill="#17343B">Retícula i espai</text><rect x="63.0236" y="235" width="28" height="67" rx="2" fill="#FFFFFF" stroke="#176B5B" stroke-width="0.5"/><rect x="98.0236" y="235" width="28" height="67" rx="2" fill="#FFFFFF" stroke="#176B5B" stroke-width="0.5"/><rect x="133.0236" y="235" width="28" height="67" rx="2" fill="#FFFFFF" stroke="#176B5B" stroke-width="0.5"/><rect x="168.0236" y="235" width="28" height="67" rx="2" fill="#FFFFFF" stroke="#176B5B" stroke-width="0.5"/><rect x="203.0236" y="235" width="28" height="67" rx="2" fill="#FFFFFF" stroke="#176B5B" stroke-width="0.5"/><rect x="238.0236" y="235" width="28" height="67" rx="2" fill="#FFFFFF" stroke="#176B5B" stroke-width="0.5"/><line x1="63.0236" y1="262" x2="279.6377952755906" y2="262" stroke="#176B5B" stroke-width="0.4"/><rect x="303.6377952755906" y="197" width="240.6141952755906" height="132" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="315.6377952755906" y="217.92" font-size="10" font-weight="500" fill="#17343B">Lletres i números</text><text x="315.6377952755906" y="270.68" font-size="40" font-weight="700" fill="#17343B">Aa</text><text x="315.6377952755906" y="297.92" font-size="10" font-weight="400" fill="#17343B">Col·laboració · 012345</text><rect x="51.0236" y="341" width="240.6141952755906" height="132" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="63.0236" y="361.92" font-size="10" font-weight="500" fill="#17343B">Color amb funció</text><rect x="63.0236" y="381" width="29" height="40" rx="4" fill="#17343B" stroke="none" stroke-width="0.4"/><rect x="98.0236" y="381" width="29" height="40" rx="4" fill="#F4F5EF" stroke="#17343B" stroke-width="0.4"/><rect x="133.0236" y="381" width="29" height="40" rx="4" fill="#FFFFFF" stroke="#17343B" stroke-width="0.4"/><rect x="168.0236" y="381" width="29" height="40" rx="4" fill="#176B5B" stroke="none" stroke-width="0.4"/><rect x="203.0236" y="381" width="29" height="40" rx="4" fill="#E4B44C" stroke="none" stroke-width="0.4"/><rect x="238.0236" y="381" width="29" height="40" rx="4" fill="#A33832" stroke="none" stroke-width="0.4"/><text x="63.0236" y="446.92" font-size="10" font-weight="400" fill="#17343B">Acció · lectura · orientació</text><rect x="303.6377952755906" y="341" width="240.6141952755906" height="132" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="315.6377952755906" y="361.92" font-size="10" font-weight="500" fill="#17343B">Connexions i targetes</text><g transform="translate(318.6377952755906,385) scale(1.625,1.625)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><rect x="388.6377952755906" y="381" width="130" height="60" rx="5" fill="#FFFFFF" stroke="#17343B" stroke-width="0.5"/><text x="398.6377952755906" y="399.92" font-size="10" font-weight="500" fill="#17343B">Revisar els textos</text><rect x="398.6377952755906" y="409" width="42.952" height="23" rx="11.5" fill="#F4F5EF" stroke="#17343B" stroke-width="0.5"/><text x="407.6377952755906" y="421.936" font-size="8" font-weight="500" fill="#17343B">Per fer</text><text x="51.0236" y="514.888" font-size="14" font-weight="500" fill="#17343B">Composició que orienta</text><text x="51.0236" y="535.416" font-size="10.5" font-weight="400" fill="#17343B">Les peces s’alineen a una retícula i deixen espai entre grups. Les relacions s’expliquen amb</text><text x="51.0236" y="550.416" font-size="10.5" font-weight="400" fill="#17343B">proximitat, línies i capçaleres discretes. A la interfície, aquesta pauta es tradueix en projectes ben</text><text x="51.0236" y="565.416" font-size="10.5" font-weight="400" fill="#17343B">separats, files llegibles i targetes que es poden comparar sense soroll.</text><text x="51.0236" y="595.888" font-size="14" font-weight="500" fill="#17343B">Tipografia que acompanya</text><text x="51.0236" y="616.416" font-size="10.5" font-weight="400" fill="#17343B">DM Sans aporta una veu directa amb formes obertes i una mateixa família per a nom, títols i lectura.</text><text x="51.0236" y="631.416" font-size="10.5" font-weight="400" fill="#17343B">Els canvis de pes i mida fan visible la jerarquia; la personalitat no depèn d’afegir altres fonts.</text><text x="51.0236" y="661.888" font-size="14" font-weight="500" fill="#17343B">Color i recursos amb funció</text><text x="51.0236" y="682.416" font-size="10.5" font-weight="400" fill="#17343B">La tinta fosca sosté la lectura; el paper i el blanc creen superfícies tranquil·les. El verd destaca</text><text x="51.0236" y="697.416" font-size="10.5" font-weight="400" fill="#17343B">accions, l’ocre acompanya l’activitat i l’argila assenyala errors amb text. Els traços connectats</text><text x="51.0236" y="712.416" font-size="10.5" font-weight="400" fill="#17343B">suggereixen coordinació i inspiren el símbol de Trama. Les miniatures de tasques mostren dades</text><text x="51.0236" y="727.416" font-size="10.5" font-weight="400" fill="#17343B">fictícies, no captures d’un producte implementat.</text><text x="51.0236" y="752.928" font-size="9" font-weight="400" fill="#17343B">Recursos futurs: incorporar fotografies o altres imatges només si aporten informació i se’n comproven l’origen i les</text><text x="51.0236" y="765.428" font-size="9" font-weight="400" fill="#17343B">condicions d’ús.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">04</text></svg></section><section class="pagina" aria-label="Pàgina 5: Missió, visió, valors i to"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Missió, visió, valors i to</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Utilitat que es pot reconèixer</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Missió, visió, valors i to</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">Decisió editorial adoptada. La missió i els valors adapten al català les notes de treball del repositori.</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">La visió es formula per completar aquesta versió; no consta com a acord de l’equip. El posicionament</text><text x="51.0236" y="176.416" font-size="10.5" font-weight="400" fill="#17343B">comercial es manté separat de l’abast acadèmic.</text><rect x="51.0236" y="197" width="493.2283905511812" height="88" rx="6" fill="#176B5B" stroke="none" stroke-width="0.6"/><text x="65.0236" y="219.904" font-size="12" font-weight="500" fill="#FFFFFF">Missió</text><text x="65.0236" y="242.912" font-size="11" font-weight="400" fill="#FFFFFF">Crear eines digitals pràctiques i agradables d’utilitzar que ajudin els equips de pimes a</text><text x="65.0236" y="257.912" font-size="11" font-weight="400" fill="#FFFFFF">registrar i organitzar la seva feina amb menys fricció, aprenent ràpidament i sense</text><text x="65.0236" y="272.912" font-size="11" font-weight="400" fill="#FFFFFF">interrompre la seva activitat diària.</text><rect x="51.0236" y="297" width="493.2283905511812" height="73" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="65.0236" y="319.904" font-size="12" font-weight="500" fill="#17343B">Visió</text><text x="65.0236" y="342.912" font-size="11" font-weight="400" fill="#17343B">Esdevenir una eina de confiança per coordinar el treball quotidià d’equips petits, amb una</text><text x="65.0236" y="357.912" font-size="11" font-weight="400" fill="#17343B">organització clara que es pugui comprendre i mantenir sense una càrrega innecessària.</text><rect x="51.0236" y="382" width="493.2283905511812" height="26" rx="3" fill="#17343B" stroke="none" stroke-width="0.6"/><text x="59.0236" y="398.2256" font-size="9.3" font-weight="500" fill="#FFFFFF">Valor adoptat</text><text x="209.0236" y="398.2256" font-size="9.3" font-weight="500" fill="#FFFFFF">Conducta observable</text><rect x="51.0236" y="408" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="425.2256" font-size="9.3" font-weight="400" fill="#17343B">Utilitat en el treball real</text><text x="209.0236" y="425.2256" font-size="9.3" font-weight="400" fill="#17343B">Prioritzar consultar, registrar i trobar tasques amb pocs passos.</text><line x1="51.0236" y1="436" x2="544.2519905511812" y2="436" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="436" width="493.2283905511812" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="453.2256" font-size="9.3" font-weight="400" fill="#17343B">Proximitat i escolta</text><text x="209.0236" y="453.2256" font-size="9.3" font-weight="400" fill="#17343B">Revisar les decisions a partir d’observacions i retorn comprovats.</text><line x1="51.0236" y1="464" x2="544.2519905511812" y2="464" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="464" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="481.2256" font-size="9.3" font-weight="400" fill="#17343B">Claredat</text><text x="209.0236" y="481.2256" font-size="9.3" font-weight="400" fill="#17343B">Mantenir noms coherents i explicar estats, errors i permisos.</text><line x1="51.0236" y1="492" x2="544.2519905511812" y2="492" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="492" width="493.2283905511812" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="509.2256" font-size="9.3" font-weight="400" fill="#17343B">Enginy pràctic</text><text x="209.0236" y="509.2256" font-size="9.3" font-weight="400" fill="#17343B">Reutilitzar solucions simples i components que resolguin bé cada acció.</text><line x1="51.0236" y1="520" x2="544.2519905511812" y2="520" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="520" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="537.2256" font-size="9.3" font-weight="400" fill="#17343B">Responsabilitat a llarg termini</text><text x="209.0236" y="537.2256" font-size="9.3" font-weight="400" fill="#17343B">Preservar llegibilitat, coherència i facilitat de manteniment.</text><line x1="51.0236" y1="548" x2="544.2519905511812" y2="548" stroke="#17343B" stroke-width="0.3"/><text x="51.0236" y="573.888" font-size="14" font-weight="500" fill="#17343B">To de comunicació</text><text x="51.0236" y="594.416" font-size="10.5" font-weight="400" fill="#17343B">Trama parla amb claredat, de manera directa i propera. Les etiquetes anomenen l’acció; les</text><text x="51.0236" y="609.416" font-size="10.5" font-weight="400" fill="#17343B">instruccions expliquen què cal introduir; els missatges indiquen el resultat o el pas possible. Evitem</text><text x="51.0236" y="624.416" font-size="10.5" font-weight="400" fill="#17343B">culpabilitzar, prometre resultats no comprovats o substituir informació útil per eslògans.</text><text x="51.0236" y="649.928" font-size="9" font-weight="500" fill="#176B5B">Acció</text><text x="151.0236" y="650.424" font-size="9.5" font-weight="400" fill="#17343B">Crea una tasca</text><text x="51.0236" y="667.928" font-size="9" font-weight="500" fill="#176B5B">Instrucció</text><text x="151.0236" y="668.424" font-size="9.5" font-weight="400" fill="#17343B">Escriu un títol que expliqui què cal fer.</text><text x="51.0236" y="685.928" font-size="9" font-weight="500" fill="#176B5B">Confirmació</text><text x="151.0236" y="686.424" font-size="9.5" font-weight="400" fill="#17343B">Tasca creada.</text><text x="51.0236" y="703.928" font-size="9" font-weight="500" fill="#176B5B">Validació</text><text x="151.0236" y="704.424" font-size="9.5" font-weight="400" fill="#17343B">Escriu el títol de la tasca per continuar.</text><text x="51.0236" y="721.928" font-size="9" font-weight="500" fill="#176B5B">Restricció</text><text x="151.0236" y="722.424" font-size="9.5" font-weight="400" fill="#17343B">Aquesta tasca està feta. Ja no se’n pot canviar l’estat.</text><text x="51.0236" y="744.928" font-size="9" font-weight="400" fill="#17343B">La responsabilitat a llarg termini s’adopta com a compromís de qualitat i manteniment. No implica resultats de</text><text x="51.0236" y="757.428" font-size="9" font-weight="400" fill="#17343B">sostenibilitat mesurats.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">05</text></svg></section><section class="pagina" aria-label="Pàgina 6: Color amb una funció clara"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Color amb una funció clara</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Sistema cromàtic</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Color amb una funció clara</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">Decisió editorial adoptada. Sis colors cobreixen les necessitats de lectura, estructura, interacció i</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">retorn. La paleta breu facilita la coherència entre peces i evita afegir colors per a cada tipus de tasca.</text><rect x="51.0236" y="182" width="156.4094635170604" height="42" rx="4" fill="#17343B" stroke="none" stroke-width="0.4"/><text x="51.0236" y="240.92" font-size="10" font-weight="500" fill="#17343B">Tinta</text><text x="51.0236" y="255.928" font-size="9" font-weight="400" fill="#17343B">#17343B</text><rect x="219.43306351706042" y="182" width="156.4094635170604" height="42" rx="4" fill="#F4F5EF" stroke="none" stroke-width="0.4"/><text x="219.43306351706042" y="240.92" font-size="10" font-weight="500" fill="#17343B">Paper</text><text x="219.43306351706042" y="255.928" font-size="9" font-weight="400" fill="#17343B">#F4F5EF</text><rect x="387.8425270341208" y="182" width="156.4094635170604" height="42" rx="4" fill="#FFFFFF" stroke="#17343B" stroke-width="0.4"/><text x="387.8425270341208" y="240.92" font-size="10" font-weight="500" fill="#17343B">Blanc</text><text x="387.8425270341208" y="255.928" font-size="9" font-weight="400" fill="#17343B">#FFFFFF</text><rect x="51.0236" y="269" width="156.4094635170604" height="42" rx="4" fill="#176B5B" stroke="none" stroke-width="0.4"/><text x="51.0236" y="327.92" font-size="10" font-weight="500" fill="#17343B">Verd trama</text><text x="51.0236" y="342.928" font-size="9" font-weight="400" fill="#17343B">#176B5B</text><rect x="219.43306351706042" y="269" width="156.4094635170604" height="42" rx="4" fill="#E4B44C" stroke="none" stroke-width="0.4"/><text x="219.43306351706042" y="327.92" font-size="10" font-weight="500" fill="#17343B">Ocre</text><text x="219.43306351706042" y="342.928" font-size="9" font-weight="400" fill="#17343B">#E4B44C</text><rect x="387.8425270341208" y="269" width="156.4094635170604" height="42" rx="4" fill="#A33832" stroke="none" stroke-width="0.4"/><text x="387.8425270341208" y="327.92" font-size="10" font-weight="500" fill="#17343B">Argila</text><text x="387.8425270341208" y="342.928" font-size="9" font-weight="400" fill="#17343B">#A33832</text><rect x="51.0236" y="362" width="493.2283905511812" height="26" rx="3" fill="#17343B" stroke="none" stroke-width="0.6"/><text x="59.0236" y="377.928" font-size="9" font-weight="500" fill="#FFFFFF">Color · HEX</text><text x="199.0236" y="377.928" font-size="9" font-weight="500" fill="#FFFFFF">Funció</text><text x="334.0236" y="377.928" font-size="9" font-weight="500" fill="#FFFFFF">Regla d’ús</text><rect x="51.0236" y="388" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="404.928" font-size="9" font-weight="400" fill="#17343B">Tinta · #17343B</text><text x="199.0236" y="404.928" font-size="9" font-weight="400" fill="#17343B">Text i estructura</text><text x="334.0236" y="404.928" font-size="9" font-weight="400" fill="#17343B">Text principal; contorns essencials.</text><line x1="51.0236" y1="416" x2="544.2519905511812" y2="416" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="416" width="493.2283905511812" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="432.928" font-size="9" font-weight="400" fill="#17343B">Paper · #F4F5EF</text><text x="199.0236" y="432.928" font-size="9" font-weight="400" fill="#17343B">Fons general</text><text x="334.0236" y="432.928" font-size="9" font-weight="400" fill="#17343B">Àrees àmplies de descans visual.</text><line x1="51.0236" y1="444" x2="544.2519905511812" y2="444" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="444" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="460.928" font-size="9" font-weight="400" fill="#17343B">Blanc · #FFFFFF</text><text x="199.0236" y="460.928" font-size="9" font-weight="400" fill="#17343B">Superfícies</text><text x="334.0236" y="460.928" font-size="9" font-weight="400" fill="#17343B">Targetes i text sobre fons fosc.</text><line x1="51.0236" y1="472" x2="544.2519905511812" y2="472" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="472" width="493.2283905511812" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="488.928" font-size="9" font-weight="400" fill="#17343B">Verd trama · #176B5B</text><text x="199.0236" y="488.928" font-size="9" font-weight="400" fill="#17343B">Acció i confirmació</text><text x="334.0236" y="488.928" font-size="9" font-weight="400" fill="#17343B">Acció principal; enllaços identificables.</text><line x1="51.0236" y1="500" x2="544.2519905511812" y2="500" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="500" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="516.928" font-size="9" font-weight="400" fill="#17343B">Ocre · #E4B44C</text><text x="199.0236" y="516.928" font-size="9" font-weight="400" fill="#17343B">Destacats i progrés</text><text x="334.0236" y="516.928" font-size="9" font-weight="400" fill="#17343B">Sempre amb text Tinta.</text><line x1="51.0236" y1="528" x2="544.2519905511812" y2="528" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="528" width="493.2283905511812" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="544.928" font-size="9" font-weight="400" fill="#17343B">Argila · #A33832</text><text x="199.0236" y="544.928" font-size="9" font-weight="400" fill="#17343B">Error</text><text x="334.0236" y="544.928" font-size="9" font-weight="400" fill="#17343B">Sempre amb text o icona explicativa.</text><line x1="51.0236" y1="556" x2="544.2519905511812" y2="556" stroke="#17343B" stroke-width="0.3"/><text x="51.0236" y="581.888" font-size="14" font-weight="500" fill="#17343B">Superfícies i controls</text><text x="51.0236" y="601.92" font-size="10" font-weight="400" fill="#17343B">Paper és el fons general; Blanc sosté targetes i camps. La diferència entre els fons és subtil: els camps</text><text x="51.0236" y="616.92" font-size="10" font-weight="400" fill="#17343B">incorporen un contorn Tinta quan el límit és necessari per reconèixer-los.</text><text x="51.0236" y="647.888" font-size="14" font-weight="500" fill="#17343B">Informació amb text</text><text x="51.0236" y="667.92" font-size="10" font-weight="400" fill="#17343B">Les etiquetes «Per fer», «En progrés» i «Feta» sempre acompanyen el color. Els enllaços es reconeixen</text><text x="51.0236" y="682.92" font-size="10" font-weight="400" fill="#17343B">també pel subratllat; confirmacions i errors expliquen el resultat. El color no concedeix permisos ni</text><text x="51.0236" y="697.92" font-size="10" font-weight="400" fill="#17343B">modifica regles de tasca.</text><text x="51.0236" y="723.928" font-size="9" font-weight="400" fill="#17343B">Els noms i valors HEX constitueixen la referència comuna per a la interfície, els prototips i la documentació.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">06</text></svg></section><section class="pagina" aria-label="Pàgina 7: Contrast i informació visible"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Contrast i informació visible</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Color aplicat</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Contrast i informació visible</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">Els parells s’han calculat amb la luminància relativa de WCAG 2.2. AA exigeix 4,5:1 per al text normal i</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">3:1 per al text gran: 18 pt o 14 pt en negreta, 24 px o 18,7 px. Els contorns i símbols essencials</text><text x="51.0236" y="176.416" font-size="10.5" font-weight="400" fill="#17343B">requereixen 3:1 quan és aplicable el criteri de contrast no textual.</text><rect x="51.0236" y="197" width="493.2283905511812" height="26" rx="3" fill="#17343B" stroke="none" stroke-width="0.6"/><text x="59.0236" y="212.928" font-size="9" font-weight="500" fill="#FFFFFF">Text / fons</text><text x="254.0236" y="212.928" font-size="9" font-weight="500" fill="#FFFFFF">Ràtio</text><text x="319.0236" y="212.928" font-size="9" font-weight="500" fill="#FFFFFF">Resultat</text><rect x="51.0236" y="223" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="239.928" font-size="9" font-weight="400" fill="#17343B">Blanc / Tinta</text><text x="254.0236" y="239.928" font-size="9" font-weight="400" fill="#17343B">13,20:1</text><text x="319.0236" y="239.928" font-size="9" font-weight="400" fill="#17343B">Apte per a text normal.</text><line x1="51.0236" y1="251" x2="544.2519905511812" y2="251" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="251" width="493.2283905511812" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="267.928" font-size="9" font-weight="400" fill="#17343B">Tinta / Paper</text><text x="254.0236" y="267.928" font-size="9" font-weight="400" fill="#17343B">12,04:1</text><text x="319.0236" y="267.928" font-size="9" font-weight="400" fill="#17343B">Apte per a text normal.</text><line x1="51.0236" y1="279" x2="544.2519905511812" y2="279" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="279" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="295.928" font-size="9" font-weight="400" fill="#17343B">Blanc / Verd trama</text><text x="254.0236" y="295.928" font-size="9" font-weight="400" fill="#17343B">6,38:1</text><text x="319.0236" y="295.928" font-size="9" font-weight="400" fill="#17343B">Apte per a text normal.</text><line x1="51.0236" y1="307" x2="544.2519905511812" y2="307" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="307" width="493.2283905511812" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="323.928" font-size="9" font-weight="400" fill="#17343B">Verd trama / Paper</text><text x="254.0236" y="323.928" font-size="9" font-weight="400" fill="#17343B">5,82:1</text><text x="319.0236" y="323.928" font-size="9" font-weight="400" fill="#17343B">Apte per a text normal.</text><line x1="51.0236" y1="335" x2="544.2519905511812" y2="335" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="335" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="351.928" font-size="9" font-weight="400" fill="#17343B">Tinta / Ocre</text><text x="254.0236" y="351.928" font-size="9" font-weight="400" fill="#17343B">6,87:1</text><text x="319.0236" y="351.928" font-size="9" font-weight="400" fill="#17343B">Apte per a text normal.</text><line x1="51.0236" y1="363" x2="544.2519905511812" y2="363" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="363" width="493.2283905511812" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="379.928" font-size="9" font-weight="400" fill="#17343B">Argila / Blanc</text><text x="254.0236" y="379.928" font-size="9" font-weight="400" fill="#17343B">6,63:1</text><text x="319.0236" y="379.928" font-size="9" font-weight="400" fill="#17343B">Apte per a text normal.</text><line x1="51.0236" y1="391" x2="544.2519905511812" y2="391" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="391" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="407.928" font-size="9" font-weight="400" fill="#17343B">Blanc / Ocre</text><text x="254.0236" y="407.928" font-size="9" font-weight="400" fill="#17343B">1,92:1</text><text x="319.0236" y="407.928" font-size="9" font-weight="400" fill="#17343B">Evitar: no supera els llindars.</text><line x1="51.0236" y1="419" x2="544.2519905511812" y2="419" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="419" width="493.2283905511812" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="435.928" font-size="9" font-weight="400" fill="#17343B">Paper / Blanc</text><text x="254.0236" y="435.928" font-size="9" font-weight="400" fill="#17343B">1,10:1</text><text x="319.0236" y="435.928" font-size="9" font-weight="400" fill="#17343B">No serveix com a límit essencial.</text><line x1="51.0236" y1="447" x2="544.2519905511812" y2="447" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="459" width="150" height="32" rx="6" fill="#176B5B" stroke="none" stroke-width="1"/><text x="86.2076" y="478.8535" font-size="10.5" font-weight="500" fill="#FFFFFF">Crea el projecte</text><text x="224.0236" y="477.416" font-size="10.5" font-weight="500" fill="#176B5B">Obre el projecte</text><line x1="224.0236" y1="481" x2="306.0236" y2="481" stroke="#176B5B" stroke-width="0.7"/><rect x="381.0236" y="463" width="63.648" height="23" rx="11.5" fill="#E4B44C" stroke="none" stroke-width="0.5"/><text x="390.0236" y="476.928" font-size="9" font-weight="500" fill="#17343B">En progrés</text><text x="51.0236" y="516.424" font-size="9.5" font-weight="500" fill="#17343B">Nom de la tasca</text><rect x="51.0236" y="525" width="220" height="30" rx="4" fill="#FFFFFF" stroke="#17343B" stroke-width="0.7"/><text x="60.0236" y="542.92" font-size="10" font-weight="400" fill="#17343B">Revisar els textos</text><text x="296.0236" y="516.424" font-size="9.5" font-weight="500" fill="#17343B">Títol de la tasca</text><rect x="296.0236" y="525" width="248" height="30" rx="4" fill="#FFFFFF" stroke="#A33832" stroke-width="0.7"/><text x="305.0236" y="542.92" font-size="10" font-weight="400" fill="#17343B"></text><text x="296.0236" y="568.928" font-size="9" font-weight="400" fill="#A33832">Escriu un títol.</text><text x="51.0236" y="585.888" font-size="14" font-weight="500" fill="#17343B">Llegir abans de decorar</text><text x="51.0236" y="605.92" font-size="10" font-weight="400" fill="#17343B">«Crea el projecte» utilitza Blanc sobre Verd trama. Les etiquetes i dades utilitzen Tinta sobre Blanc; «En</text><text x="51.0236" y="620.92" font-size="10" font-weight="400" fill="#17343B">progrés», Tinta sobre Ocre. Els errors combinen Argila sobre Blanc amb instruccions com «Escriu un nom</text><text x="51.0236" y="635.92" font-size="10" font-weight="400" fill="#17343B">per a la tasca».</text><text x="51.0236" y="666.888" font-size="14" font-weight="500" fill="#17343B">Separació i focus</text><text x="51.0236" y="686.92" font-size="10" font-weight="400" fill="#17343B">Un camp blanc sobre Paper necessita contorn Tinta si el límit permet reconèixer-lo. El focus requereix un</text><text x="51.0236" y="701.92" font-size="10" font-weight="400" fill="#17343B">traç contrastat, més enllà del canvi de fons. Espaiat, alineació i capçaleres ordenen les taules.</text><text x="51.0236" y="727.928" font-size="9" font-weight="400" fill="#17343B">Classificació feta amb els valors sense arrodonir; ràtios mostrades amb dos decimals.</text><text x="51.0236" y="745.428" font-size="9" font-weight="400" fill="#17343B">Font: W3C, WCAG 2.2, criteris 1.4.3 i 1.4.11 · https://www.w3.org/TR/WCAG22/</text><text x="51.0236" y="762.928" font-size="9" font-weight="400" fill="#17343B">Aquesta revisió de parells no acredita la conformitat AA de tota l’aplicació: també cal comprovar contingut, navegació</text><text x="51.0236" y="775.428" font-size="9" font-weight="400" fill="#17343B">i interacció.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">07</text></svg></section><section class="pagina" aria-label="Pàgina 8: Una sola família, moltes funcions"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Una sola família, moltes funcions</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Tipografia</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Una sola família, moltes funcions</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">Decisió editorial adoptada. DM Sans és la família per al nom, els títols, la lectura i els controls. La</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">construcció clara encaixa amb una eina que presenta projectes, responsables i tasques. Una família</text><text x="51.0236" y="176.416" font-size="10.5" font-weight="400" fill="#17343B">compartida redueix combinacions i facilita mantenir els estils.</text><rect x="51.0236" y="197" width="493.2283905511812" height="125" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="67.0236" y="242.728" font-size="34" font-weight="700" fill="#17343B">Aa · 0123456789</text><text x="67.0236" y="271.888" font-size="14" font-weight="400" fill="#17343B">Col·laboració, assignació, pròxima tasca</text><text x="67.0236" y="299.888" font-size="14" font-weight="500" fill="#17343B">À È É Í Ò Ó Ú Ç · l·l · qüestió</text><rect x="51.0236" y="342" width="493.2283905511812" height="26" rx="3" fill="#17343B" stroke="none" stroke-width="0.6"/><text x="59.0236" y="358.92" font-size="10" font-weight="500" fill="#FFFFFF">Pes</text><text x="169.0236" y="358.92" font-size="10" font-weight="500" fill="#FFFFFF">Aplicació</text><text x="309.0236" y="358.92" font-size="10" font-weight="500" fill="#FFFFFF">Mostra</text><rect x="51.0236" y="368" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="385.92" font-size="10" font-weight="400" fill="#17343B">Regular 400</text><text x="169.0236" y="385.92" font-size="10" font-weight="400" fill="#17343B">Lectura i dades</text><text x="309.0236" y="385.92" font-size="10" font-weight="400" fill="#17343B">Revisa les tasques del projecte.</text><line x1="51.0236" y1="396" x2="544.2519905511812" y2="396" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="396" width="493.2283905511812" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="413.92" font-size="10" font-weight="400" fill="#17343B">Medium 500</text><text x="169.0236" y="413.92" font-size="10" font-weight="400" fill="#17343B">Subtítols i botons</text><text x="309.0236" y="413.92" font-size="10" font-weight="500" fill="#17343B">Desa els canvis</text><line x1="51.0236" y1="424" x2="544.2519905511812" y2="424" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="424" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="441.92" font-size="10" font-weight="400" fill="#17343B">Bold 700</text><text x="169.0236" y="441.92" font-size="10" font-weight="400" fill="#17343B">Títols</text><text x="309.0236" y="441.92" font-size="10" font-weight="700" fill="#17343B">Projectes compartits</text><line x1="51.0236" y1="452" x2="544.2519905511812" y2="452" stroke="#17343B" stroke-width="0.3"/><text x="51.0236" y="477.888" font-size="14" font-weight="500" fill="#17343B">Pesos amb responsabilitat</text><text x="51.0236" y="498.416" font-size="10.5" font-weight="400" fill="#17343B">Regular 400 sosté els paràgrafs, les descripcions i les dades. Medium 500 diferencia subtítols,</text><text x="51.0236" y="513.416" font-size="10.5" font-weight="400" fill="#17343B">etiquetes i botons sense competir amb el contingut. Bold 700 identifica els títols i els punts</text><text x="51.0236" y="528.416" font-size="10.5" font-weight="400" fill="#17343B">d’entrada. No s’afegeixen pesos ni famílies per compensar una jerarquia insuficient.</text><text x="51.0236" y="558.888" font-size="14" font-weight="500" fill="#17343B">Comprovar la llengua i les dades</text><text x="51.0236" y="579.416" font-size="10.5" font-weight="400" fill="#17343B">Les mostres inclouen accents, ela geminada i xifres: «Col·laboració, assignació, pròxima tasca,</text><text x="51.0236" y="594.416" font-size="10.5" font-weight="400" fill="#17343B">qüestió, accés». També «À È É Í Ò Ó Ú Ç · 0123456789». La prova ha de mantenir aquests signes en</text><text x="51.0236" y="609.416" font-size="10.5" font-weight="400" fill="#17343B">exportacions i controls petits. Les dates i els recomptes s’alineen segons la seva funció, sense</text><text x="51.0236" y="624.416" font-size="10.5" font-weight="400" fill="#17343B">separar-los de les etiquetes.</text><text x="51.0236" y="654.888" font-size="14" font-weight="500" fill="#17343B">Llegibilitat quotidiana</text><text x="51.0236" y="675.416" font-size="10.5" font-weight="400" fill="#17343B">Els paràgrafs s’alineen a l’esquerra i eviten la justificació forçada. Les majúscules es reserven per a</text><text x="51.0236" y="690.416" font-size="10.5" font-weight="400" fill="#17343B">identificadors breus; els botons utilitzen frases llegibles com «Desa els canvis». Un text secundari es</text><text x="51.0236" y="705.416" font-size="10.5" font-weight="400" fill="#17343B">diferencia per jerarquia i espai, conservant una combinació cromàtica comprovada.</text><text x="51.0236" y="730.928" font-size="9" font-weight="400" fill="#17343B">La llicència oficial de DM Sans consultada és SIL Open Font License 1.1; conservar-la amb els fitxers de font distribuïts.</text><text x="51.0236" y="748.428" font-size="9" font-weight="400" fill="#17343B">Origen: Google Fonts · https://github.com/google/fonts/tree/main/ofl/dmsans</text><text x="51.0236" y="765.928" font-size="9" font-weight="400" fill="#17343B">Manrope i Inter són referències anteriors; aquesta versió utilitza exclusivament DM Sans.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">08</text></svg></section><section class="pagina" aria-label="Pàgina 9: Jerarquia per llegir i actuar"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Jerarquia per llegir i actuar</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Escala tipogràfica</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Jerarquia per llegir i actuar</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">Decisió editorial adoptada. El manual utilitza punts tipogràfics; la interfície, píxels de referència.</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">Comparteixen família i pesos, amb escales adaptades al suport. En cada parell, el primer valor és la</text><text x="51.0236" y="176.416" font-size="10.5" font-weight="400" fill="#17343B">mida i el segon, l’interlineat.</text><rect x="51.0236" y="197" width="493.2283905511812" height="26" rx="3" fill="#17343B" stroke="none" stroke-width="0.6"/><text x="59.0236" y="212.928" font-size="9" font-weight="500" fill="#FFFFFF">Funció</text><text x="239.0236" y="212.928" font-size="9" font-weight="500" fill="#FFFFFF">Document · pt</text><text x="339.0236" y="212.928" font-size="9" font-weight="500" fill="#FFFFFF">Interfície · px</text><rect x="51.0236" y="223" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="239.928" font-size="9" font-weight="400" fill="#17343B">Títol · Bold 700</text><text x="239.0236" y="239.928" font-size="9" font-weight="400" fill="#17343B">24 / 28</text><text x="339.0236" y="239.928" font-size="9" font-weight="400" fill="#17343B">28 / 34; mòbil 24 / 30</text><line x1="51.0236" y1="251" x2="544.2519905511812" y2="251" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="251" width="493.2283905511812" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="267.928" font-size="9" font-weight="400" fill="#17343B">Subtítol · Medium 500</text><text x="239.0236" y="267.928" font-size="9" font-weight="400" fill="#17343B">14 / 19</text><text x="339.0236" y="267.928" font-size="9" font-weight="400" fill="#17343B">20 / 26</text><line x1="51.0236" y1="279" x2="544.2519905511812" y2="279" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="279" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="295.928" font-size="9" font-weight="400" fill="#17343B">Lectura · Regular 400</text><text x="239.0236" y="295.928" font-size="9" font-weight="400" fill="#17343B">10,5 / 15</text><text x="339.0236" y="295.928" font-size="9" font-weight="400" fill="#17343B">16 / 24</text><line x1="51.0236" y1="307" x2="544.2519905511812" y2="307" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="307" width="493.2283905511812" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="323.928" font-size="9" font-weight="400" fill="#17343B">Etiqueta i botó · Medium 500</text><text x="239.0236" y="323.928" font-size="9" font-weight="400" fill="#17343B">10,5 / 15</text><text x="339.0236" y="323.928" font-size="9" font-weight="400" fill="#17343B">14 / 20</text><line x1="51.0236" y1="335" x2="544.2519905511812" y2="335" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="335" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="351.928" font-size="9" font-weight="400" fill="#17343B">Nota · Regular 400</text><text x="239.0236" y="351.928" font-size="9" font-weight="400" fill="#17343B">9 / 12,5</text><text x="339.0236" y="351.928" font-size="9" font-weight="400" fill="#17343B">12 / 16</text><line x1="51.0236" y1="363" x2="544.2519905511812" y2="363" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="363" width="493.2283905511812" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="379.928" font-size="9" font-weight="400" fill="#17343B">Dada destacada · Bold 700</text><text x="239.0236" y="379.928" font-size="9" font-weight="400" fill="#17343B">24 / 28</text><text x="339.0236" y="379.928" font-size="9" font-weight="400" fill="#17343B">28 / 34</text><line x1="51.0236" y1="391" x2="544.2519905511812" y2="391" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="403" width="493.2283905511812" height="157" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="66.0236" y="436.832" font-size="21" font-weight="700" fill="#17343B">Projecte Aula oberta</text><text x="66.0236" y="462.88" font-size="15" font-weight="500" fill="#17343B">Tasques del projecte</text><text x="66.0236" y="485.416" font-size="10.5" font-weight="400" fill="#17343B">Organitza el treball i localitza cada responsable.</text><text x="66.0236" y="512.424" font-size="9.5" font-weight="500" fill="#17343B">Nom de la tasca</text><rect x="66.0236" y="521" width="225" height="30" rx="4" fill="#FFFFFF" stroke="#17343B" stroke-width="0.7"/><text x="75.0236" y="538.92" font-size="10" font-weight="400" fill="#17343B">Revisar els textos</text><rect x="324.0236" y="519" width="200" height="30" rx="6" fill="#176B5B" stroke="none" stroke-width="1"/><text x="391.67835" y="537.8535" font-size="10.5" font-weight="500" fill="#FFFFFF">Crea la tasca</text><text x="51.0236" y="579.888" font-size="14" font-weight="500" fill="#17343B">Una seqüència reconeixible</text><text x="51.0236" y="599.92" font-size="10" font-weight="400" fill="#17343B">El títol introdueix la vista; el subtítol agrupa el contingut; el paràgraf dona context. L’etiqueta identifica el</text><text x="51.0236" y="614.92" font-size="10" font-weight="400" fill="#17343B">camp i el botó descriu l’acció. Les capçaleres de taula es diferencien de les dades amb pes i espai.</text><text x="51.0236" y="645.888" font-size="14" font-weight="500" fill="#17343B">Adaptar sense comprimir</text><text x="51.0236" y="665.92" font-size="10" font-weight="400" fill="#17343B">En mòbil, el títol passa de 28 a 24 px i la lectura es manté a 16 px. Les etiquetes poden ocupar dues línies;</text><text x="51.0236" y="680.92" font-size="10" font-weight="400" fill="#17343B">els controls creixen abans de reduir el text. Les taules conserven agrupacions llegibles o desplaçament.</text><text x="51.0236" y="711.888" font-size="14" font-weight="500" fill="#17343B">Espai com a jerarquia</text><text x="51.0236" y="731.92" font-size="10" font-weight="400" fill="#17343B">La proximitat relaciona etiqueta, camp i ajuda. Una separació més gran inicia un grup nou. Els 12 px es</text><text x="51.0236" y="746.92" font-size="10" font-weight="400" fill="#17343B">reserven per a informació secundària breu, mai per a instruccions indispensables.</text><text x="51.0236" y="772.928" font-size="9" font-weight="400" fill="#17343B">Per a informació operativa breu, mínim de 14 px; per a lectura continuada, 16 px.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">09</text></svg></section><section class="pagina" aria-label="Pàgina 10: Un identificador que connecta"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Un identificador que connecta</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Logo · construcció</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Un identificador que connecta</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">Decisió editorial adoptada. Trama uneix el nom en DM Sans Bold amb tres traços verticals</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">connectats. La forma suggereix projectes, persones i tasques relacionats dins d’una estructura</text><text x="51.0236" y="176.416" font-size="10.5" font-weight="400" fill="#17343B">comuna. Aquesta interpretació guia el disseny d’aquesta versió, sense atribuir-li un acord col·lectiu</text><text x="51.0236" y="191.416" font-size="10.5" font-weight="400" fill="#17343B">previ.</text><rect x="51.0236" y="212" width="493.2283905511812" height="130" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><g transform="translate(129.0236,246) scale(1.625,1.625)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><text x="200.5236" y="299.209" font-size="52" font-weight="700" fill="#17343B">Trama</text><text x="67.0236" y="326.928" font-size="9" font-weight="500" fill="#17343B">Versió principal</text><rect x="51.0236" y="358" width="240.6141952755906" height="108" rx="6" fill="#FFFFFF" stroke="#17343B" stroke-width="0.5"/><g transform="translate(73.0236,385) scale(1.0,1.0)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#17343B" stroke-width="4" stroke-linecap="round"/></g><text x="117.0236" y="417.744" font-size="32" font-weight="700" fill="#17343B">Trama</text><text x="63.0236" y="449.928" font-size="9" font-weight="400" fill="#17343B">Una tinta sobre fons clar</text><rect x="303.6377952755906" y="358" width="240.6141952755906" height="108" rx="6" fill="#17343B" stroke="none" stroke-width="0.6"/><g transform="translate(325.6377952755906,385) scale(1.0,1.0)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/></g><text x="369.6377952755906" y="417.744" font-size="32" font-weight="700" fill="#FFFFFF">Trama</text><text x="315.6377952755906" y="449.928" font-size="9" font-weight="400" fill="#FFFFFF">Inversa sobre fons fosc</text><text x="51.0236" y="499.888" font-size="14" font-weight="500" fill="#17343B">Construcció simple</text><text x="51.0236" y="520.416" font-size="10.5" font-weight="400" fill="#17343B">El símbol es dibuixa en una caixa de 32 × 32 unitats amb traços arrodonits de 4 unitats. Els eixos</text><text x="51.0236" y="535.416" font-size="10.5" font-weight="400" fill="#17343B">verticals se situen a 8, 16 i 24; el central s’estén de 4 a 28 i els laterals de 8 a 24. Una connexió</text><text x="51.0236" y="550.416" font-size="10.5" font-weight="400" fill="#17343B">horitzontal a 16 uneix els tres. El nom conserva proporcions i espaiat tipogràfic coherent.</text><text x="51.0236" y="580.888" font-size="14" font-weight="500" fill="#17343B">Versió principal</text><text x="51.0236" y="601.416" font-size="10.5" font-weight="400" fill="#17343B">Sobre Blanc o Paper, el símbol utilitza Verd trama i el nom, Tinta. Aquesta combinació diferencia</text><text x="51.0236" y="616.416" font-size="10.5" font-weight="400" fill="#17343B">l’identificador sense convertir-lo en un element dominant. La versió principal es reserva per a</text><text x="51.0236" y="631.416" font-size="10.5" font-weight="400" fill="#17343B">capçaleres, portada i documentació amb espai suficient.</text><text x="51.0236" y="661.888" font-size="14" font-weight="500" fill="#17343B">Una tinta i fons fosc</text><text x="51.0236" y="682.416" font-size="10.5" font-weight="400" fill="#17343B">La versió monocroma utilitza un únic color per al símbol i el nom. Sobre Tinta, la versió inversa és</text><text x="51.0236" y="697.416" font-size="10.5" font-weight="400" fill="#17343B">completament blanca. No s’apliquen ombres, degradats ni contorns afegits. Quan el fons conté una</text><text x="51.0236" y="712.416" font-size="10.5" font-weight="400" fill="#17343B">imatge, es col·loca el logo sobre una superfície neta que mantingui la lectura.</text><text x="51.0236" y="737.928" font-size="9" font-weight="400" fill="#17343B">Els recursos SVG adjunts contenen geometria vectorial; les mostres del manual en documenten la proposta.</text><text x="51.0236" y="755.428" font-size="9" font-weight="400" fill="#17343B">L’ús del nom Trama no acredita registre legal de marca ni disponibilitat de domini.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">10</text></svg></section><section class="pagina" aria-label="Pàgina 11: Proporció, protecció i reducció"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Proporció, protecció i reducció</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Logo · normes d’ús</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Proporció, protecció i reducció</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">Decisió editorial adoptada. La unitat x equival al gruix del traç: 4 unitats en la caixa de 32. Aquesta</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">referència conserva les separacions a qualsevol mida. El conjunt s’escala sempre proporcionalment.</text><rect x="51.0236" y="182" width="493.2283905511812" height="139" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><g transform="translate(146.0236,225) scale(1.375,1.375)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><text x="206.5236" y="270.023" font-size="44" font-weight="700" fill="#17343B">Trama</text><line x1="135.0236" y1="214" x2="405.0236" y2="214" stroke="#176B5B" stroke-width="0.6"/><line x1="135.0236" y1="292" x2="405.0236" y2="292" stroke="#176B5B" stroke-width="0.6"/><line x1="135.0236" y1="214" x2="135.0236" y2="292" stroke="#176B5B" stroke-width="0.6"/><line x1="405.0236" y1="214" x2="405.0236" y2="292" stroke="#176B5B" stroke-width="0.6"/><text x="63.0236" y="302.928" font-size="9" font-weight="500" fill="#176B5B">2x · espai lliure</text><text x="381.0236" y="302.928" font-size="9" font-weight="400" fill="#17343B">x = gruix del traç</text><text x="51.0236" y="346.912" font-size="11" font-weight="500" fill="#17343B">Comparació digital a escala</text><g transform="translate(51.0236,362) scale(0.6258344459279039,0.6258344459279039)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><text x="78.56031562082778" y="382.4923230974633" font-size="20.026702269692926" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="400.928" font-size="9" font-weight="500" fill="#17343B">120 px</text><g transform="translate(186.0236,362) scale(0.5215287049399199,0.5215287049399199)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><text x="208.97086301735646" y="379.07693591455273" font-size="16.688918558077436" font-weight="700" fill="#17343B">Trama</text><text x="186.0236" y="400.928" font-size="9" font-weight="500" fill="#17343B">100 px</text><g transform="translate(321.0236,362) scale(0.4172229639519359,0.4172229639519359)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><text x="339.3814104138852" y="375.6615487316422" font-size="13.35113484646195" font-weight="700" fill="#17343B">Trama</text><text x="321.0236" y="400.928" font-size="9" font-weight="500" fill="#17343B">80 px</text><g transform="translate(461.0236,362) scale(0.75,0.75)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><g transform="translate(489.0236,362) scale(0.5625,0.5625)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><g transform="translate(517.0236,362) scale(0.46875,0.46875)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><text x="446.0236" y="399.936" font-size="8" font-weight="400" fill="#17343B">32 · 24 · 20 px</text><rect x="51.0236" y="420" width="493.2283905511812" height="26" rx="3" fill="#17343B" stroke="none" stroke-width="0.6"/><text x="59.0236" y="435.928" font-size="9" font-weight="500" fill="#FFFFFF">Regla</text><text x="279.0236" y="435.928" font-size="9" font-weight="500" fill="#FFFFFF">Mesura de referència</text><rect x="51.0236" y="446" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="462.928" font-size="9" font-weight="400" fill="#17343B">Mínim digital del conjunt</text><text x="279.0236" y="462.928" font-size="9" font-weight="400" fill="#17343B">120 px d’amplada.</text><line x1="51.0236" y1="474" x2="544.2519905511812" y2="474" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="474" width="493.2283905511812" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="490.928" font-size="9" font-weight="400" fill="#17343B">Mínim digital del símbol</text><text x="279.0236" y="490.928" font-size="9" font-weight="400" fill="#17343B">24 px; conjunt imprès: 30 mm.</text><line x1="51.0236" y1="502" x2="544.2519905511812" y2="502" stroke="#17343B" stroke-width="0.3"/><text x="51.0236" y="527.888" font-size="14" font-weight="500" fill="#17343B">Espai que protegeix</text><text x="51.0236" y="547.92" font-size="10" font-weight="400" fill="#17343B">La separació símbol–nom és 3x: 12 unitats a la mida de construcció. La zona de seguretat exterior és 2x: 8</text><text x="51.0236" y="562.92" font-size="10" font-weight="400" fill="#17343B">unitats lliures a cada costat. Aquesta àrea no conté textos, vores ni altres elements.</text><text x="51.0236" y="593.888" font-size="14" font-weight="500" fill="#17343B">Reducció amb una prova visible</text><text x="51.0236" y="613.92" font-size="10" font-weight="400" fill="#17343B">La comparació del conjunt a 120, 100 i 80 px i del símbol a 32, 24 i 20 px permet revisar la reducció.</text><text x="51.0236" y="628.92" font-size="10" font-weight="400" fill="#17343B">Aquesta versió adopta 120 px per al conjunt i 24 px per al símbol. En impressió, l’amplada mínima del</text><text x="51.0236" y="643.92" font-size="10" font-weight="400" fill="#17343B">conjunt és 30 mm.</text><text x="51.0236" y="674.888" font-size="14" font-weight="500" fill="#17343B">Quan l’espai és limitat</text><text x="51.0236" y="694.92" font-size="10" font-weight="400" fill="#17343B">El símbol compacte necessita que el nom Trama sigui accessible en el context. No substitueix una</text><text x="51.0236" y="709.92" font-size="10" font-weight="400" fill="#17343B">etiqueta d’acció. Les exportacions rasteritzades es generen a la resolució final: ampliar una miniatura no</text><text x="51.0236" y="724.92" font-size="10" font-weight="400" fill="#17343B">recupera qualitat.</text><text x="51.0236" y="750.928" font-size="9" font-weight="400" fill="#17343B">Mínims comprovats en aquest render. Les mesures exclouen la protecció exterior. Prova en dispositius i impressió</text><text x="51.0236" y="763.428" font-size="9" font-weight="400" fill="#17343B">física pendent.</text><text x="51.0236" y="780.928" font-size="9" font-weight="400" fill="#17343B">Prohibit deformar, girar, retallar o modificar individualment les proporcions dels elements.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">11</text></svg></section><section class="pagina" aria-label="Pàgina 12: Recursos que expliquen el treball"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Recursos que expliquen el treball</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Imatges i elements visuals</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Recursos que expliquen el treball</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">Decisió editorial adoptada. Les imatges expliquen projectes o accions sense competir amb les</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">tasques. Aquest manual utilitza recursos propis i dades fictícies identificades. Les fotografies</text><text x="51.0236" y="176.416" font-size="10.5" font-weight="400" fill="#17343B">externes queden pendents d’obtenció i comprovació de l’origen i les condicions d’ús.</text><rect x="51.0236" y="197" width="156.4094635170604" height="150" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="60.0236" y="215.928" font-size="9" font-weight="500" fill="#17343B">Captura informativa</text><rect x="60.0236" y="237" width="138.4094635170604" height="83" rx="4" fill="#FFFFFF" stroke="#17343B" stroke-width="0.5"/><text x="68.0236" y="253.928" font-size="9" font-weight="500" fill="#17343B">Portal del taller</text><text x="68.0236" y="274.936" font-size="8" font-weight="400" fill="#17343B">Projecte</text><text x="68.0236" y="288.936" font-size="8" font-weight="400" fill="#17343B">Col·laboradors</text><text x="68.0236" y="302.936" font-size="8" font-weight="400" fill="#17343B">Tasques</text><rect x="219.43306351706042" y="197" width="156.4094635170604" height="150" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="228.43306351706042" y="215.928" font-size="9" font-weight="500" fill="#17343B">Detall de tasca</text><rect x="227.43306351706042" y="233" width="140.4094635170604" height="100" rx="7" fill="#FFFFFF" stroke="#17343B" stroke-width="0.5"/><text x="237.43306351706042" y="253.416" font-size="10.5" font-weight="500" fill="#17343B">Revisar textos</text><text x="237.43306351706042" y="284.432" font-size="8.5" font-weight="400" fill="#17343B">Documentació</text><text x="237.43306351706042" y="300.928" font-size="9" font-weight="400" fill="#17343B">Membre B</text><rect x="237.43306351706042" y="308" width="42.952" height="23" rx="11.5" fill="#F4F5EF" stroke="#17343B" stroke-width="0.5"/><text x="246.43306351706042" y="320.9
