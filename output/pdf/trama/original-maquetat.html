36" font-size="8" font-weight="500" fill="#17343B">Per fer</text><rect x="387.8425270341208" y="197" width="156.4094635170604" height="150" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="396.8425270341208" y="215.928" font-size="9" font-weight="500" fill="#17343B">Il·lustració decorativa</text><g transform="translate(399.8425270341208,248) scale(1.0,1.0)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><g transform="translate(441.8425270341208,248) scale(1.0,1.0)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><g transform="translate(483.8425270341208,248) scale(1.0,1.0)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><text x="396.8425270341208" y="324.432" font-size="8.5" font-weight="400" fill="#17343B">Connexions simples</text><text x="51.0236" y="377.888" font-size="14" font-weight="500" fill="#17343B">Informació i decoració</text><text x="51.0236" y="398.416" font-size="10.5" font-weight="400" fill="#17343B">Una captura informativa mostra un control, una estructura o un canvi. El retall destaca la zona</text><text x="51.0236" y="413.416" font-size="10.5" font-weight="400" fill="#17343B">rellevant i conserva text llegible. Una il·lustració decorativa contextualitza portades o estats buits,</text><text x="51.0236" y="428.416" font-size="10.5" font-weight="400" fill="#17343B">sense substituir instruccions ni interrompre la lectura.</text><text x="51.0236" y="458.888" font-size="14" font-weight="500" fill="#17343B">Qualitat i coherència</text><text x="51.0236" y="479.416" font-size="10.5" font-weight="400" fill="#17343B">El logo, els diagrames i les icones es mantenen en vector sempre que sigui possible. Les captures i</text><text x="51.0236" y="494.416" font-size="10.5" font-weight="400" fill="#17343B">fotografies són recursos rasteritzats i necessiten prou resolució a la mida final. S’eviten ampliacions</text><text x="51.0236" y="509.416" font-size="10.5" font-weight="400" fill="#17343B">borroses, filtres que ocultin informació i retalls que eliminin un estat o una etiqueta necessària.</text><text x="51.0236" y="539.888" font-size="14" font-weight="500" fill="#17343B">Text alternatiu amb propòsit</text><text x="51.0236" y="560.416" font-size="10.5" font-weight="400" fill="#17343B">Una imatge informativa explica en text la dada o relació necessària: «Tauler del projecte Aula oberta</text><text x="51.0236" y="575.416" font-size="10.5" font-weight="400" fill="#17343B">amb tres tasques distribuïdes entre Per fer, En progrés i Feta». Una imatge decorativa integrada en</text><text x="51.0236" y="590.416" font-size="10.5" font-weight="400" fill="#17343B">una interfície web utilitza text alternatiu buit. Si el contingut ja és complet en el text proper, no es</text><text x="51.0236" y="605.416" font-size="10.5" font-weight="400" fill="#17343B">repeteix sense necessitat.</text><rect x="51.0236" y="622" width="493.2283905511812" height="26" rx="3" fill="#17343B" stroke="none" stroke-width="0.6"/><text x="59.0236" y="637.928" font-size="9" font-weight="500" fill="#FFFFFF">Recurs d’exemple</text><text x="269.0236" y="637.928" font-size="9" font-weight="500" fill="#FFFFFF">Criteri</text><rect x="51.0236" y="648" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="664.928" font-size="9" font-weight="400" fill="#17343B">Captura de projecte · 16:10</text><text x="269.0236" y="664.928" font-size="9" font-weight="400" fill="#17343B">Mostrar títol, participants ficticis i acció.</text><line x1="51.0236" y1="676" x2="544.2519905511812" y2="676" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="676" width="493.2283905511812" height="28" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="692.928" font-size="9" font-weight="400" fill="#17343B">Detall de targeta · 4:3</text><text x="269.0236" y="692.928" font-size="9" font-weight="400" fill="#17343B">Prioritzar tasca, responsable i estat.</text><line x1="51.0236" y1="704" x2="544.2519905511812" y2="704" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="704" width="493.2283905511812" height="28" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="720.928" font-size="9" font-weight="400" fill="#17343B">Il·lustració de connexions · 1:1</text><text x="269.0236" y="720.928" font-size="9" font-weight="400" fill="#17343B">Mantenir-la subordinada al contingut.</text><line x1="51.0236" y1="732" x2="544.2519905511812" y2="732" stroke="#17343B" stroke-width="0.3"/><text x="51.0236" y="752.928" font-size="9" font-weight="400" fill="#17343B">Exemples amb dades fictícies. No s’hi incorporen dades personals ni captures privades de l’equip.</text><text x="51.0236" y="770.428" font-size="9" font-weight="400" fill="#17343B">Les proporcions orienten la composició; el contingut informatiu preval sobre el retall.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">12</text></svg></section><section class="pagina" aria-label="Pàgina 13: Usos incorrectes i correctes"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Usos incorrectes i correctes</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Coherència del sistema · 01</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Usos incorrectes i correctes</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">Les comparacions mostren el mateix contingut amb dues resolucions. La correcció conserva la</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">informació i en millora la lectura. Els exemples marcats «Incorrecte» no són versions alternatives</text><text x="51.0236" y="176.416" font-size="10.5" font-weight="400" fill="#17343B">autoritzades: serveixen per reconèixer errors abans de publicar una peça.</text><text x="51.0236" y="207.912" font-size="11" font-weight="500" fill="#17343B">Logo</text><rect x="51.0236" y="218" width="239.6141952755906" height="21" rx="3" fill="#A33832" stroke="none" stroke-width="0.6"/><text x="59.0236" y="230.928" font-size="9" font-weight="500" fill="#FFFFFF">Incorrecte</text><rect x="304.6377952755906" y="218" width="239.6141952755906" height="21" rx="3" fill="#176B5B" stroke="none" stroke-width="0.6"/><text x="312.6377952755906" y="230.928" font-size="9" font-weight="500" fill="#FFFFFF">Correcte</text><g transform="translate(53.0236,250) scale(1.1859374999999999,0.71875)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><text x="97.0236" y="267.864" font-size="17" font-weight="700" fill="#17343B">Trama</text><rect x="51.0236" y="247" width="239.6141952755906" height="28" rx="0" fill="none" stroke="#A33832" stroke-width="0.6"/><g transform="translate(318.6377952755906,247) scale(0.84375,0.84375)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><text x="355.7627952755906" y="274.62775" font-size="27" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="295.928" font-size="9" font-weight="400" fill="#17343B">Identificador estirat i enganxat al marge.</text><text x="304.6377952755906" y="295.928" font-size="9" font-weight="400" fill="#17343B">Proporció original i zona de seguretat de 2x.</text><text x="51.0236" y="325.912" font-size="11" font-weight="500" fill="#17343B">Contrast</text><rect x="51.0236" y="336" width="239.6141952755906" height="21" rx="3" fill="#A33832" stroke="none" stroke-width="0.6"/><text x="59.0236" y="348.928" font-size="9" font-weight="500" fill="#FFFFFF">Incorrecte</text><rect x="304.6377952755906" y="336" width="239.6141952755906" height="21" rx="3" fill="#176B5B" stroke="none" stroke-width="0.6"/><text x="312.6377952755906" y="348.928" font-size="9" font-weight="500" fill="#FFFFFF">Correcte</text><rect x="51.0236" y="365" width="239.6141952755906" height="29" rx="4" fill="#E4B44C" stroke="none" stroke-width="0.6"/><text x="63.0236" y="382.912" font-size="11" font-weight="500" fill="#FFFFFF">En progrés</text><rect x="304.6377952755906" y="365" width="239.6141952755906" height="29" rx="4" fill="#E4B44C" stroke="none" stroke-width="0.6"/><text x="316.6377952755906" y="382.912" font-size="11" font-weight="500" fill="#17343B">En progrés</text><text x="51.0236" y="413.928" font-size="9" font-weight="400" fill="#17343B">Text blanc damunt d’ocre.</text><text x="304.6377952755906" y="413.928" font-size="9" font-weight="400" fill="#17343B">Text tinta damunt d’ocre; parell comprovat a la pàgina 7.</text><text x="51.0236" y="443.912" font-size="11" font-weight="500" fill="#17343B">Jerarquia</text><rect x="51.0236" y="454" width="239.6141952755906" height="21" rx="3" fill="#A33832" stroke="none" stroke-width="0.6"/><text x="59.0236" y="466.928" font-size="9" font-weight="500" fill="#FFFFFF">Incorrecte</text><rect x="304.6377952755906" y="454" width="239.6141952755906" height="21" rx="3" fill="#176B5B" stroke="none" stroke-width="0.6"/><text x="312.6377952755906" y="466.928" font-size="9" font-weight="500" fill="#FFFFFF">Correcte</text><text x="56.0236" y="497.92" font-size="10" font-weight="400" fill="#17343B">Projecte · tasques · responsable</text><text x="312.6377952755906" y="495.896" font-size="13" font-weight="700" fill="#17343B">Projecte</text><text x="312.6377952755906" y="509.928" font-size="9" font-weight="400" fill="#17343B">Tasques · Responsable</text><text x="51.0236" y="531.928" font-size="9" font-weight="400" fill="#17343B">Títol, etiqueta i text amb el mateix pes i mida.</text><text x="304.6377952755906" y="531.928" font-size="9" font-weight="400" fill="#17343B">Títol Bold, etiqueta Medium i lectura Regular.</text><text x="51.0236" y="561.912" font-size="11" font-weight="500" fill="#17343B">Estat</text><rect x="51.0236" y="572" width="239.6141952755906" height="21" rx="3" fill="#A33832" stroke="none" stroke-width="0.6"/><text x="59.0236" y="584.928" font-size="9" font-weight="500" fill="#FFFFFF">Incorrecte</text><rect x="304.6377952755906" y="572" width="239.6141952755906" height="21" rx="3" fill="#176B5B" stroke="none" stroke-width="0.6"/><text x="312.6377952755906" y="584.928" font-size="9" font-weight="500" fill="#FFFFFF">Correcte</text><rect x="59.0236" y="604" width="19" height="19" rx="9" fill="#E4B44C" stroke="none" stroke-width="0.6"/><rect x="312.6377952755906" y="601" width="63.648" height="23" rx="11.5" fill="#E4B44C" stroke="none" stroke-width="0.5"/><text x="321.6377952755906" y="614.928" font-size="9" font-weight="500" fill="#17343B">En progrés</text><text x="51.0236" y="649.928" font-size="9" font-weight="400" fill="#17343B">Punt ocre sense explicació.</text><text x="304.6377952755906" y="649.928" font-size="9" font-weight="400" fill="#17343B">Etiqueta «En progrés» i indicador gràfic complementari.</text><text x="51.0236" y="690.92" font-size="10" font-weight="400" fill="#17343B">Conserveu les proporcions i l’espai del logo. La jerarquia i el contrast treballen junts: no feu més clar el</text><text x="51.0236" y="705.92" font-size="10" font-weight="400" fill="#17343B">text petit per reduir-ne el pes. Els estats sempre es llegeixen amb paraules. Consulteu els parells de</text><text x="51.0236" y="720.92" font-size="10" font-weight="400" fill="#17343B">contrast a la pàgina 7.</text><text x="51.0236" y="746.928" font-size="9" font-weight="400" fill="#17343B">Exemples de control de qualitat. Les regles descrites són decisions editorials adoptades en aquesta versió.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">13</text></svg></section><section class="pagina" aria-label="Pàgina 14: Ordre que facilita l’acció"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Ordre que facilita l’acció</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Coherència del sistema · 02</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Ordre que facilita l’acció</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">Una peça clara permet decidir on mirar i què fer. Fotografies, camps, taules i botons han de donar</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">suport al contingut. Quan tots els elements reclamen atenció alhora, es fa més difícil localitzar una</text><text x="51.0236" y="176.416" font-size="10.5" font-weight="400" fill="#17343B">tasca o entendre l’acció disponible.</text><text x="51.0236" y="207.912" font-size="11" font-weight="500" fill="#17343B">Imatges</text><rect x="51.0236" y="218" width="239.6141952755906" height="21" rx="3" fill="#A33832" stroke="none" stroke-width="0.6"/><text x="59.0236" y="230.928" font-size="9" font-weight="500" fill="#FFFFFF">Incorrecte</text><rect x="304.6377952755906" y="218" width="239.6141952755906" height="21" rx="3" fill="#176B5B" stroke="none" stroke-width="0.6"/><text x="312.6377952755906" y="230.928" font-size="9" font-weight="500" fill="#FFFFFF">Correcte</text><rect x="55.0236" y="247" width="34" height="17" rx="0" fill="#E4B44C" stroke="none" stroke-width="0.6"/><rect x="91.0236" y="247" width="34" height="17" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><rect x="127.0236" y="247" width="34" height="17" rx="0" fill="#E4B44C" stroke="none" stroke-width="0.6"/><rect x="163.0236" y="247" width="34" height="17" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><rect x="199.0236" y="247" width="34" height="17" rx="0" fill="#E4B44C" stroke="none" stroke-width="0.6"/><rect x="235.0236" y="247" width="34" height="17" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><rect x="55.0236" y="265" width="34" height="17" rx="0" fill="#E4B44C" stroke="none" stroke-width="0.6"/><rect x="91.0236" y="265" width="34" height="17" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><rect x="127.0236" y="265" width="34" height="17" rx="0" fill="#E4B44C" stroke="none" stroke-width="0.6"/><rect x="163.0236" y="265" width="34" height="17" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><rect x="199.0236" y="265" width="34" height="17" rx="0" fill="#E4B44C" stroke="none" stroke-width="0.6"/><rect x="235.0236" y="265" width="34" height="17" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><rect x="312.6377952755906" y="247" width="92" height="42" rx="3" fill="#F4F5EF" stroke="#17343B" stroke-width="0.5"/><text x="318.6377952755906" y="262.432" font-size="8.5" font-weight="500" fill="#17343B">Portal del taller</text><text x="318.6377952755906" y="278.936" font-size="8" font-weight="400" fill="#17343B">Projecte d’exemple</text><text x="51.0236" y="311.928" font-size="9" font-weight="400" fill="#17343B">Captura borrosa i dominant que desplaça les dades.</text><text x="304.6377952755906" y="311.928" font-size="9" font-weight="400" fill="#17343B">Captura nítida, retall pertinent i peu explicatiu.</text><text x="51.0236" y="355.912" font-size="11" font-weight="500" fill="#17343B">Formularis i taules</text><rect x="51.0236" y="366" width="239.6141952755906" height="21" rx="3" fill="#A33832" stroke="none" stroke-width="0.6"/><text x="59.0236" y="378.928" font-size="9" font-weight="500" fill="#FFFFFF">Incorrecte</text><rect x="304.6377952755906" y="366" width="239.6141952755906" height="21" rx="3" fill="#176B5B" stroke="none" stroke-width="0.6"/><text x="312.6377952755906" y="378.928" font-size="9" font-weight="500" fill="#FFFFFF">Correcte</text><rect x="54.0236" y="395" width="70" height="32" rx="1" fill="#F4F5EF" stroke="#17343B" stroke-width="1.5"/><text x="59.0236" y="411.936" font-size="8" font-weight="400" fill="#17343B">Dada</text><rect x="129.0236" y="395" width="70" height="32" rx="1" fill="#F4F5EF" stroke="#17343B" stroke-width="1.5"/><text x="134.0236" y="411.936" font-size="8" font-weight="400" fill="#17343B">Dada</text><rect x="204.0236" y="395" width="70" height="32" rx="1" fill="#F4F5EF" stroke="#17343B" stroke-width="1.5"/><text x="209.0236" y="411.936" font-size="8" font-weight="400" fill="#17343B">Dada</text><text x="311.6377952755906" y="404.424" font-size="9.5" font-weight="500" fill="#17343B">Títol de la tasca</text><rect x="311.6377952755906" y="413" width="210" height="30" rx="4" fill="#FFFFFF" stroke="#17343B" stroke-width="0.7"/><text x="320.6377952755906" y="430.92" font-size="10" font-weight="400" fill="#17343B">Revisar els textos</text><text x="51.0236" y="459.928" font-size="9" font-weight="400" fill="#17343B">Contorns múltiples, camps sense etiqueta i files sense</text><text x="51.0236" y="472.428" font-size="9" font-weight="400" fill="#17343B">alineació.</text><text x="304.6377952755906" y="459.928" font-size="9" font-weight="400" fill="#17343B">Etiqueta sobre el camp, espai entre grups i columnes</text><text x="304.6377952755906" y="472.428" font-size="9" font-weight="400" fill="#17343B">alineades.</text><text x="51.0236" y="503.912" font-size="11" font-weight="500" fill="#17343B">Accions</text><rect x="51.0236" y="514" width="239.6141952755906" height="21" rx="3" fill="#A33832" stroke="none" stroke-width="0.6"/><text x="59.0236" y="526.928" font-size="9" font-weight="500" fill="#FFFFFF">Incorrecte</text><rect x="304.6377952755906" y="514" width="239.6141952755906" height="21" rx="3" fill="#176B5B" stroke="none" stroke-width="0.6"/><text x="312.6377952755906" y="526.928" font-size="9" font-weight="500" fill="#FFFFFF">Correcte</text><rect x="54.0236" y="543" width="105" height="30" rx="6" fill="#FFFFFF" stroke="#176B5B" stroke-width="1"/><text x="89.9861" y="561.303" font-size="9" font-weight="500" fill="#176B5B">D’acord</text><rect x="169.0236" y="543" width="105" height="30" rx="6" fill="#FFFFFF" stroke="#176B5B" stroke-width="1"/><text x="214.7601" y="561.303" font-size="9" font-weight="500" fill="#176B5B">Fer</text><rect x="308.6377952755906" y="543" width="135" height="30" rx="6" fill="#176B5B" stroke="none" stroke-width="1"/><text x="347.96779527559056" y="561.303" font-size="9" font-weight="500" fill="#FFFFFF">Desa la tasca</text><text x="458.6377952755906" y="560.928" font-size="9" font-weight="500" fill="#176B5B">Cancel·la</text><text x="51.0236" y="607.928" font-size="9" font-weight="400" fill="#17343B">«D’acord» i «Fer» amb el mateix aspecte, sense objecte.</text><text x="304.6377952755906" y="607.928" font-size="9" font-weight="400" fill="#17343B">«Desa la tasca» com a acció principal i «Cancel·la» com a</text><text x="304.6377952755906" y="620.428" font-size="9" font-weight="400" fill="#17343B">secundària.</text><text x="51.0236" y="662.92" font-size="10" font-weight="400" fill="#17343B">Ajusteu les imatges a la funció que expliquen. Agrupeu camps relacionats, manteniu etiquetes visibles i</text><text x="51.0236" y="677.92" font-size="10" font-weight="400" fill="#17343B">alineeu dades comparables. El verd ple identifica l’acció principal; les secundàries conserven una etiqueta</text><text x="51.0236" y="692.92" font-size="10" font-weight="400" fill="#17343B">concreta i una presència menys intensa.</text><text x="51.0236" y="718.928" font-size="9" font-weight="400" fill="#17343B">Els exemples «Incorrecte» són errors deliberats. La correcció modifica la presentació, no afegeix permisos ni</text><text x="51.0236" y="731.428" font-size="9" font-weight="400" fill="#17343B">funcionalitats.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">14</text></svg></section><section class="pagina" aria-label="Pàgina 15: Del primer accés al projecte"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Del primer accés al projecte</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Aplicació al producte · 01</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Del primer accés al projecte</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">Decisió editorial adoptada. Les composicions apliquen el sistema a dues situacions: entrar des del</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">mòbil i reconèixer projectes i col·laboradors en escriptori. Tots els noms i les dades són ficticis. Les</text><text x="51.0236" y="176.416" font-size="10.5" font-weight="400" fill="#17343B">pantalles són exemples de disseny i no acrediten funcionalitats implementades.</text><rect x="51.0236" y="197" width="493.2283905511812" height="204" rx="7" fill="#F4F5EF" stroke="#17343B" stroke-width="0.5"/><g transform="translate(65.0236,209) scale(0.625,0.625)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><text x="92.5236" y="229.465" font-size="20" font-weight="700" fill="#17343B">Trama</text><line x1="161.0236" y1="205" x2="161.0236" y2="393" stroke="#17343B" stroke-width="0.4"/><text x="65.0236" y="261.928" font-size="9" font-weight="500" fill="#176B5B">Projectes</text><text x="65.0236" y="285.432" font-size="8.5" font-weight="400" fill="#17343B">Portal del taller</text><text x="176.0236" y="227.872" font-size="16" font-weight="700" fill="#17343B">Els teus projectes</text><rect x="391.0236" y="211" width="138" height="28" rx="6" fill="#176B5B" stroke="none" stroke-width="1"/><text x="425.8956" y="228.303" font-size="9" font-weight="500" fill="#FFFFFF">Crea el projecte</text><rect x="176.0236" y="258" width="165" height="61" rx="5" fill="#FFFFFF" stroke="#17343B" stroke-width="0.5"/><text x="186.0236" y="278.912" font-size="11" font-weight="500" fill="#17343B">Portal del taller</text><text x="186.0236" y="300.928" font-size="9" font-weight="500" fill="#176B5B">Obre el projecte</text><rect x="355.0236" y="258" width="165" height="61" rx="5" fill="#FFFFFF" stroke="#17343B" stroke-width="0.5"/><text x="365.0236" y="278.912" font-size="11" font-weight="500" fill="#17343B">Guia del barri</text><text x="365.0236" y="300.928" font-size="9" font-weight="500" fill="#176B5B">Obre el projecte</text><text x="176.0236" y="346.912" font-size="11" font-weight="500" fill="#17343B">Portal del taller · Col·laboradors</text><text x="176.0236" y="362.432" font-size="8.5" font-weight="500" fill="#17343B">Col·laborador</text><text x="281.0236" y="362.432" font-size="8.5" font-weight="500" fill="#17343B">Rol</text><line x1="176.0236" y1="366" x2="529.0236" y2="366" stroke="#17343B" stroke-width="0.4"/><text x="176.0236" y="377.928" font-size="9" font-weight="400" fill="#17343B">Membre A</text><text x="281.0236" y="377.928" font-size="9" font-weight="400" fill="#17343B">Administrador del projecte</text><text x="176.0236" y="393.928" font-size="9" font-weight="400" fill="#17343B">Membre B</text><text x="281.0236" y="393.928" font-size="9" font-weight="400" fill="#17343B">Membre</text><rect x="51.0236" y="422" width="190" height="247" rx="13" fill="#F4F5EF" stroke="#17343B" stroke-width="0.6"/><g transform="translate(67.0236,438) scale(0.6875,0.6875)"><path d="M8 8V24 M16 4V28 M24 8V24 M8 16H24" fill="none" stroke="#176B5B" stroke-width="4" stroke-linecap="round"/></g><text x="97.2736" y="460.5115" font-size="22" font-weight="700" fill="#17343B">Trama</text><text x="67.0236" y="500.864" font-size="17" font-weight="700" fill="#17343B">Inicia la sessió</text><text x="67.0236" y="527.424" font-size="9.5" font-weight="500" fill="#17343B">Correu electrònic</text><rect x="67.0236" y="536" width="158" height="30" rx="4" fill="#FFFFFF" stroke="#17343B" stroke-width="0.7"/><text x="76.0236" y="553.92" font-size="10" font-weight="400" fill="#17343B">membre@example.org</text><text x="67.0236" y="588.424" font-size="9.5" font-weight="500" fill="#17343B">Contrasenya</text><rect x="67.0236" y="597" width="158" height="30" rx="4" fill="#FFFFFF" stroke="#17343B" stroke-width="0.7"/><text x="76.0236" y="614.92" font-size="10" font-weight="400" fill="#17343B">••••••••</text><rect x="67.0236" y="631" width="158" height="27" rx="6" fill="#176B5B" stroke="none" stroke-width="1"/><text x="115.6936" y="647.803" font-size="9" font-weight="500" fill="#FFFFFF">Inicia la sessió</text><text x="266.0236" y="435.888" font-size="14" font-weight="500" fill="#17343B">Accés en mòbil</text><text x="266.0236" y="455.424" font-size="9.5" font-weight="400" fill="#17343B">El logo introdueix la marca sense desplaçar el formulari. «Inicia</text><text x="266.0236" y="470.424" font-size="9.5" font-weight="400" fill="#17343B">la sessió» és el títol i el botó principal; «Crea un compte» és</text><text x="266.0236" y="485.424" font-size="9.5" font-weight="400" fill="#17343B">l’enllaç alternatiu. «Correu electrònic» i «Contrasenya»</text><text x="266.0236" y="500.424" font-size="9.5" font-weight="400" fill="#17343B">continuen visibles quan s’escriu. La columna única conserva</text><text x="266.0236" y="515.424" font-size="9.5" font-weight="400" fill="#17343B">text de lectura a 16 px i marges que separen els controls.</text><text x="266.0236" y="546.888" font-size="14" font-weight="500" fill="#17343B">Projectes i col·laboradors en escriptori</text><text x="266.0236" y="566.424" font-size="9.5" font-weight="400" fill="#17343B">«Els teus projectes» precedeix dues targetes: «Portal del taller»</text><text x="266.0236" y="581.424" font-size="9.5" font-weight="400" fill="#17343B">i «Guia del barri». Cada targeta mostra el nom i l’accés al</text><text x="266.0236" y="596.424" font-size="9.5" font-weight="400" fill="#17343B">projecte. Dins de «Portal del taller», el bloc «Col·laboradors»</text><text x="266.0236" y="611.424" font-size="9.5" font-weight="400" fill="#17343B">identifica «Membre A · Administrador» i «Membre B · Membre».</text><text x="266.0236" y="626.424" font-size="9.5" font-weight="400" fill="#17343B">El creador administra el projecte; el rol s’explica amb text,</text><text x="266.0236" y="641.424" font-size="9.5" font-weight="400" fill="#17343B">sense dependre de l’avatar.</text><text x="266.0236" y="672.888" font-size="14" font-weight="500" fill="#17343B">Components compartits</text><text x="266.0236" y="692.424" font-size="9.5" font-weight="400" fill="#17343B">Botó, camp, targeta i etiqueta reutilitzen els mateixos pesos,</text><text x="266.0236" y="707.424" font-size="9.5" font-weight="400" fill="#17343B">colors i separacions. En mòbil, els blocs s’apilen mantenint</text><text x="266.0236" y="722.424" font-size="9.5" font-weight="400" fill="#17343B">l’ordre de lectura. En escriptori, la retícula permet comparar</text><text x="266.0236" y="737.424" font-size="9.5" font-weight="400" fill="#17343B">continguts sense engrandir els títols ni reduir les etiquetes.</text><text x="78.0236" y="692.92" font-size="10" font-weight="500" fill="#176B5B">Crea un compte</text><text x="51.0236" y="763.928" font-size="9" font-weight="400" fill="#17343B">Aquestes composicions són exemples del manual. L’existència i l’adequació del wireframe o prototip requerit s’han de</text><text x="51.0236" y="776.428" font-size="9" font-weight="400" fill="#17343B">comprovar separadament.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">15</text></svg></section><section class="pagina" aria-label="Pàgina 16: Tasques, estats i responsabilitat"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Tasques, estats i responsabilitat</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Aplicació al producte · 02</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Tasques, estats i responsabilitat</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">Decisió editorial adoptada. El Kanban fictici de «Portal del taller» mostra «Per fer», «En progrés» i</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">«Feta». Les targetes identifiquen títol, tipus, responsable i estat; cap dada essencial es comunica</text><text x="51.0236" y="176.416" font-size="10.5" font-weight="400" fill="#17343B">només amb color.</text><rect x="51.0236" y="197" width="493.2283905511812" height="174" rx="7" fill="#F4F5EF" stroke="#17343B" stroke-width="0.5"/><text x="63.0236" y="220.888" font-size="14" font-weight="700" fill="#17343B">Portal del taller · Tasques</text><rect x="63.0236" y="233" width="46.071000000000005" height="23" rx="11.5" fill="#F4F5EF" stroke="#17343B" stroke-width="0.5"/><text x="72.0236" y="246.928" font-size="9" font-weight="500" fill="#17343B">Per fer</text><rect x="63.0236" y="262" width="149" height="100" rx="7" fill="#FFFFFF" stroke="#17343B" stroke-width="0.5"/><text x="73.0236" y="282.416" font-size="10.5" font-weight="500" fill="#17343B">Revisar els textos</text><text x="73.0236" y="313.432" font-size="8.5" font-weight="400" fill="#17343B">Documentació</text><text x="73.0236" y="329.928" font-size="9" font-weight="400" fill="#17343B">Sense responsable</text><rect x="73.0236" y="337" width="42.952" height="23" rx="11.5" fill="#F4F5EF" stroke="#17343B" stroke-width="0.5"/><text x="82.0236" y="349.936" font-size="8" font-weight="500" fill="#17343B">Per fer</text><rect x="222.0236" y="233" width="63.648" height="23" rx="11.5" fill="#E4B44C" stroke="none" stroke-width="0.5"/><text x="231.0236" y="246.928" font-size="9" font-weight="500" fill="#17343B">En progrés</text><rect x="222.0236" y="262" width="149" height="100" rx="7" fill="#FFFFFF" stroke="#17343B" stroke-width="0.5"/><text x="232.0236" y="282.416" font-size="10.5" font-weight="500" fill="#17343B">Dissenyar l’accés</text><text x="232.0236" y="313.432" font-size="8.5" font-weight="400" fill="#17343B">Disseny</text><text x="232.0236" y="329.928" font-size="9" font-weight="400" fill="#17343B">Membre B</text><rect x="232.0236" y="337" width="58.576" height="23" rx="11.5" fill="#E4B44C" stroke="none" stroke-width="0.5"/><text x="241.0236" y="349.936" font-size="8" font-weight="500" fill="#17343B">En progrés</text><rect x="381.0236" y="233" width="36.747" height="23" rx="11.5" fill="#176B5B" stroke="none" stroke-width="0.5"/><text x="390.0236" y="246.928" font-size="9" font-weight="500" fill="#FFFFFF">Feta</text><rect x="381.0236" y="262" width="149" height="100" rx="7" fill="#FFFFFF" stroke="#17343B" stroke-width="0.5"/><text x="391.0236" y="282.416" font-size="10.5" font-weight="500" fill="#17343B">Definir la paleta</text><text x="391.0236" y="313.432" font-size="8.5" font-weight="400" fill="#17343B">Disseny</text><text x="391.0236" y="329.928" font-size="9" font-weight="400" fill="#17343B">Membre A</text><rect x="391.0236" y="337" width="34.664" height="23" rx="11.5" fill="#176B5B" stroke="none" stroke-width="0.5"/><text x="400.0236" y="349.936" font-size="8" font-weight="500" fill="#FFFFFF">Feta</text><rect x="51.0236" y="390" width="190" height="287" rx="12" fill="#F4F5EF" stroke="#17343B" stroke-width="0.6"/><text x="64.0236" y="417.872" font-size="16" font-weight="700" fill="#17343B">Edita la tasca</text><text x="64.0236" y="435.432" font-size="8.5" font-weight="500" fill="#176B5B">Administrador del projecte</text><text x="64.0236" y="458.424" font-size="9.5" font-weight="500" fill="#17343B">Títol</text><rect x="64.0236" y="467" width="164" height="30" rx="4" fill="#FFFFFF" stroke="#17343B" stroke-width="0.7"/><text x="73.0236" y="484.92" font-size="10" font-weight="400" fill="#17343B">Revisar els textos</text><text x="64.0236" y="508.424" font-size="9.5" font-weight="500" fill="#17343B">Tipus</text><rect x="64.0236" y="517" width="164" height="30" rx="4" fill="#FFFFFF" stroke="#17343B" stroke-width="0.7"/><text x="73.0236" y="534.92" font-size="10" font-weight="400" fill="#17343B">Documentació</text><text x="64.0236" y="558.424" font-size="9.5" font-weight="500" fill="#17343B">Responsable</text><rect x="64.0236" y="567" width="164" height="30" rx="4" fill="#FFFFFF" stroke="#17343B" stroke-width="0.7"/><text x="73.0236" y="584.92" font-size="10" font-weight="400" fill="#17343B">Membre B</text><text x="64.0236" y="609.424" font-size="9.5" font-weight="500" fill="#17343B">Estat</text><rect x="64.0236" y="618" width="46.071000000000005" height="23" rx="11.5" fill="#F4F5EF" stroke="#17343B" stroke-width="0.5"/><text x="73.0236" y="631.928" font-size="9" font-weight="500" fill="#17343B">Per fer</text><rect x="64.0236" y="648" width="164" height="27" rx="6" fill="#176B5B" stroke="none" stroke-width="1"/><text x="117.8536" y="664.803" font-size="9" font-weight="500" fill="#FFFFFF">Desa la tasca</text><text x="261.0236" y="400.912" font-size="11" font-weight="500" fill="#17343B">Èxit</text><text x="261.0236" y="417.62399999999997" font-size="9.5" font-weight="400" fill="#17343B">La tasca s’ha desat.</text><text x="261.0236" y="440.11199999999997" font-size="11" font-weight="500" fill="#17343B">Error</text><text x="261.0236" y="456.82399999999996" font-size="9.5" font-weight="400" fill="#A33832">No s’ha pogut desar la tasca. Torna-ho a provar.</text><text x="261.0236" y="479.31199999999995" font-size="11" font-weight="500" fill="#17343B">Validació</text><text x="261.0236" y="496.02399999999994" font-size="9.5" font-weight="400" fill="#A33832">Escriu un títol per a la tasca.</text><text x="261.0236" y="518.512" font-size="11" font-weight="500" fill="#17343B">Permís</text><text x="261.0236" y="535.2239999999999" font-size="9.5" font-weight="400" fill="#17343B">L’assignació a altres membres està reservada a l’administrador</text><text x="261.0236" y="548.2239999999999" font-size="9.5" font-weight="400" fill="#17343B">del projecte.</text><text x="261.0236" y="570.712" font-size="11" font-weight="500" fill="#17343B">Estat final</text><text x="261.0236" y="587.424" font-size="9.5" font-weight="400" fill="#17343B">La tasca és feta. No se’n pot canviar l’estat.</text><text x="51.0236" y="700.92" font-size="10" font-weight="400" fill="#17343B">Membre: «Assigna’m la tasca» permet l’autoassignació. Administrador: el selector «Responsable» permet</text><text x="51.0236" y="714.92" font-size="10" font-weight="400" fill="#17343B">assignar altres membres. Els canvis d’estat respecten les responsabilitats. «Feta» no mostra controls de</text><text x="51.0236" y="728.92" font-size="10" font-weight="400" fill="#17343B">canvi d’estat.</text><text x="51.0236" y="753.928" font-size="9" font-weight="400" fill="#17343B">«Feta» bloqueja nous canvis d’estat; no s’hi pressuposa cap altre bloqueig d’edició. Els missatges combinen text i</text><text x="51.0236" y="766.428" font-size="9" font-weight="400" fill="#17343B">indicador gràfic.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">16</text></svg></section><section class="pagina" aria-label="Pàgina 17: Una identitat al servei del treball"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Una identitat al servei del treball</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Justificació i ODS</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Una identitat al servei del treball</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">El sistema es justifica per la feina que ajuda a llegir i coordinar. La coherència entre manual, prototips</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">i interfície permet reconèixer una mateixa acció en diferents contextos. Aquesta utilitat és una</text><text x="51.0236" y="176.416" font-size="10.5" font-weight="400" fill="#17343B">intenció de disseny: encara cal comprovar-la amb l’equip i amb persones usuàries.</text><text x="51.0236" y="210.888" font-size="14" font-weight="500" fill="#17343B">Lectura i orientació</text><text x="51.0236" y="231.416" font-size="10.5" font-weight="400" fill="#17343B">Una sola família tipogràfica, sis colors amb funcions definides i una jerarquia estable redueixen</text><text x="51.0236" y="246.416" font-size="10.5" font-weight="400" fill="#17343B">decisions repetides. El nom del projecte precedeix les seves tasques; els responsables i els estats</text><text x="51.0236" y="261.416" font-size="10.5" font-weight="400" fill="#17343B">tenen etiquetes explícites. El verd trama identifica les accions principals, mentre que la tinta sosté la</text><text x="51.0236" y="276.416" font-size="10.5" font-weight="400" fill="#17343B">lectura. El logo connectat aporta reconeixement sense competir amb les dades.</text><text x="51.0236" y="306.888" font-size="14" font-weight="500" fill="#17343B">Col·laboració i manteniment</text><text x="51.0236" y="327.416" font-size="10.5" font-weight="400" fill="#17343B">Els components reutilitzables faciliten que diferents membres dissenyin peces compatibles. Les</text><text x="51.0236" y="342.416" font-size="10.5" font-weight="400" fill="#17343B">normes vinculen cada recurs amb una funció, de manera que es poden revisar sense reconstruir tot</text><text x="51.0236" y="357.416" font-size="10.5" font-weight="400" fill="#17343B">el sistema. Mostrar qui és responsable d’una tasca i què permet el rol ajuda a explicar el flux</text><text x="51.0236" y="372.416" font-size="10.5" font-weight="400" fill="#17343B">documentat; no substitueix la implementació dels permisos.</text><rect x="51.0236" y="389" width="239.6141952755906" height="97" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="63.0236" y="429.744" font-size="32" font-weight="700" fill="#176B5B">04</text><text x="63.0236" y="453.904" font-size="12" font-weight="500" fill="#17343B">Educació de qualitat</text><rect x="304.6377952755906" y="389" width="239.6141952755906" height="97" rx="6" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="316.6377952755906" y="429.744" font-size="32" font-weight="700" fill="#176B5B">08</text><text x="316.6377952755906" y="453.904" font-size="12" font-weight="500" fill="#17343B">Treball digne i creixement econòmic</text><text x="51.0236" y="515.888" font-size="14" font-weight="500" fill="#17343B">ODS 4 — Educació de qualitat</text><text x="51.0236" y="535.92" font-size="10" font-weight="400" fill="#17343B">La relació amb l’ODS 4 consta en el context del projecte. La contribució prevista és facilitar l’aprenentatge</text><text x="51.0236" y="550.92" font-size="10" font-weight="400" fill="#17343B">de l’eina: vocabulari directe, formularis comprensibles, estats identificats i una presentació adaptable. El</text><text x="51.0236" y="565.92" font-size="10" font-weight="400" fill="#17343B">manual també ofereix una base per discutir decisions de disseny i revisar-les. No s’ha mesurat cap millora</text><text x="51.0236" y="580.92" font-size="10" font-weight="400" fill="#17343B">d’aprenentatge ni s’acredita compliment de metes de l’ODS.</text><text x="51.0236" y="611.888" font-size="14" font-weight="500" fill="#17343B">ODS 8 — Treball digne i creixement econòmic</text><text x="51.0236" y="631.92" font-size="10" font-weight="400" fill="#17343B">L’ODS 8 també forma part del context. L’organització visible de tasques i responsabilitats pot donar</text><text x="51.0236" y="646.92" font-size="10" font-weight="400" fill="#17343B">suport a la coordinació i reduir dubtes sobre l’acció següent. L’orientació comercial cap a pimes és una</text><text x="51.0236" y="661.92" font-size="10" font-weight="400" fill="#17343B">decisió editorial i no amplia els requisits acadèmics. El sistema no demostra increments de productivitat,</text><text x="51.0236" y="676.92" font-size="10" font-weight="400" fill="#17343B">creació d’ocupació ni resultats econòmics o socials.</text><text x="51.0236" y="702.928" font-size="9" font-weight="400" fill="#17343B">Fonts de referència dels objectius: Nacions Unides — sdgs.un.org/goals/goal4 i sdgs.un.org/goals/goal8. La contribució</text><text x="51.0236" y="715.428" font-size="9" font-weight="400" fill="#17343B">descrita és prevista, no mesurada.</text><line x1="51.0236" y1="801" x2="544.2519905511812" y2="801" stroke="#17343B" stroke-width="0.4"/><text x="51.0236" y="819.432" font-size="8.5" font-weight="500" fill="#17343B">Trama · Manual d’identitat visual</text><text x="276.0236" y="819.432" font-size="8.5" font-weight="400" fill="#17343B">Versió editorial tancada</text><text x="530.2519905511812" y="819.432" font-size="8.5" font-weight="700" fill="#17343B">17</text></svg></section><section class="pagina" aria-label="Pàgina 18: Normes essencials i validació"><svg viewBox="0 0 595.2755905511812 841.8897637795277" xmlns="http://www.w3.org/2000/svg" role="img"><title>Normes essencials i validació</title><rect x="0" y="0" width="595.2755905511812" height="841.8897637795277" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="51.0236" y="35.92" font-size="10" font-weight="700" fill="#17343B">Trama</text><text x="51.0236" y="80.928" font-size="9" font-weight="500" fill="#176B5B">Consulta ràpida</text><text x="51.0236" y="114.80799999999999" font-size="24" font-weight="700" fill="#17343B">Normes essencials i validació</text><text x="51.0236" y="146.416" font-size="10.5" font-weight="400" fill="#17343B">Versió editorial tancada: el contingut, l’ordre i les normes d’aquest manual queden fixats per a</text><text x="51.0236" y="161.416" font-size="10.5" font-weight="400" fill="#17343B">aquesta versió. Les decisions s’han adoptat editorialment per construir un sistema complet. Aquest</text><text x="51.0236" y="176.416" font-size="10.5" font-weight="400" fill="#17343B">tancament no acredita un acord del conjunt de l’equip, registre de marca ni entrega acadèmica.</text><text x="51.0236" y="210.888" font-size="14" font-weight="500" fill="#17343B">Aplicar el sistema</text><text x="51.0236" y="230.92" font-size="10" font-weight="400" fill="#17343B">Utilitzeu tinta per llegir, paper i blanc com a bases, verd trama per a l’acció principal, ocre amb text tinta i</text><text x="51.0236" y="245.92" font-size="10" font-weight="400" fill="#17343B">argila amb un missatge d’error. Conserveu els parells de contrast comprovats. Manteniu DM Sans: 400 per</text><text x="51.0236" y="260.92" font-size="10" font-weight="400" fill="#17343B">a lectura, 500 per a etiquetes i botons, 700 per a títols. Distingiu punts editorials i píxels d’interfície.</text><text x="51.0236" y="291.888" font-size="14" font-weight="500" fill="#17343B">Conservar la coherència</text><text x="51.0236" y="311.92" font-size="10" font-weight="400" fill="#17343B">Reproduïu el logo a partir dels vectors, sense deformar-lo i amb 2x de protecció. Respecteu els mínims</text><text x="51.0236" y="326.92" font-size="10" font-weight="400" fill="#17343B">proposats a la pàgina 11. Les imatges han de ser nítides, pertinents i acompanyades de text alternatiu</text><text x="51.0236" y="341.92" font-size="10" font-weight="400" fill="#17343B">quan informen. Els components mantenen jerarquia i etiquetes; els estats inclouen text. «Feta» impedeix</text><text x="51.0236" y="356.92" font-size="10" font-weight="400" fill="#17343B">nous canvis d’estat.</text><rect x="51.0236" y="374" width="493.2283905511812" height="26" rx="3" fill="#17343B" stroke="none" stroke-width="0.6"/><text x="59.0236" y="389.7296" font-size="8.8" font-weight="500" fill="#FFFFFF">Norma adoptada</text><text x="171.0236" y="389.7296" font-size="8.8" font-weight="500" fill="#FFFFFF">Evidència disponible</text><text x="304.0236" y="389.7296" font-size="8.8" font-weight="500" fill="#FFFFFF">Comprovació</text><text x="453.0236" y="389.7296" font-size="8.8" font-weight="500" fill="#FFFFFF">Estat</text><rect x="51.0236" y="400" width="493.2283905511812" height="40" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="416.7296" font-size="8.8" font-weight="400" fill="#17343B">Paleta i contrast</text><text x="171.0236" y="416.7296" font-size="8.8" font-weight="400" fill="#17343B">Mostres i ràtios de la pàgina</text><text x="171.0236" y="428.7296" font-size="8.8" font-weight="400" fill="#17343B">7.</text><text x="304.0236" y="416.7296" font-size="8.8" font-weight="400" fill="#17343B">Verificació dels parells</text><text x="304.0236" y="428.7296" font-size="8.8" font-weight="400" fill="#17343B">publicats.</text><text x="453.0236" y="416.7296" font-size="8.8" font-weight="400" fill="#17343B">Control tècnic</text><text x="453.0236" y="428.7296" font-size="8.8" font-weight="400" fill="#17343B">documentat</text><line x1="51.0236" y1="440" x2="544.2519905511812" y2="440" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="440" width="493.2283905511812" height="40" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="456.7296" font-size="8.8" font-weight="400" fill="#17343B">DM Sans i escala</text><text x="171.0236" y="456.7296" font-size="8.8" font-weight="400" fill="#17343B">Font, llicència i mostres del</text><text x="171.0236" y="468.7296" font-size="8.8" font-weight="400" fill="#17343B">manual.</text><text x="304.0236" y="456.7296" font-size="8.8" font-weight="400" fill="#17343B">Glifs i exportació tipogràfica.</text><text x="453.0236" y="456.7296" font-size="8.8" font-weight="400" fill="#17343B">Control tècnic</text><text x="453.0236" y="468.7296" font-size="8.8" font-weight="400" fill="#17343B">documentat</text><line x1="51.0236" y1="480" x2="544.2519905511812" y2="480" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="480" width="493.2283905511812" height="40" rx="0" fill="#F4F5EF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="496.7296" font-size="8.8" font-weight="400" fill="#17343B">Logo i mínims</text><text x="171.0236" y="496.7296" font-size="8.8" font-weight="400" fill="#17343B">Vectors i proves de</text><text x="171.0236" y="508.7296" font-size="8.8" font-weight="400" fill="#17343B">reducció.</text><text x="304.0236" y="496.7296" font-size="8.8" font-weight="400" fill="#17343B">Reproducció en context real.</text><text x="453.0236" y="496.7296" font-size="8.8" font-weight="400" fill="#17343B">Proves d’ús</text><text x="453.0236" y="508.7296" font-size="8.8" font-weight="400" fill="#17343B">pendents</text><line x1="51.0236" y1="520" x2="544.2519905511812" y2="520" stroke="#17343B" stroke-width="0.3"/><rect x="51.0236" y="520" width="493.2283905511812" height="40" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0.6"/><text x="59.0236" y="536.7296" font-size="8.8" font-weight="400" fill="#17343B">Missió, visió i valors</text><text x="171.0236" y="536.7296" font-size="8.8" font-weight="400" fill="#17343B">Context, notes i decisió</text><text x="171.0236" y="548.7296" font-size="8.8" font-weight="400" fill="#17343B">editorial.</text><text x="304.0236" y="536.7296" font-size="8.8" font-weight="400" fill="#17343B">Revisió del conjunt de l’equip.</text><text x="453.0236" y="536.7296" font-size="8.8" font-wei
